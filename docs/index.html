<body>
<title>평생교육학 영어 학습 프로그램</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: Toss/Apple-style single column — grey ground, white rounded cards, big numbers, segmented tabs. Color: Soongsil blue */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#F7F8FA; --ink:#191F28; --muted:#6B7684; --line:#E5E8EB;
  --accent:#0A8BD6; --accent-ink:#FFFFFF; --accent-soft:#E6F4FC; --navy:#003F7D;
  --mark:#E6F4FC; --mark-ink:#00508F;
  --good:#12A26B; --warn:#F08C00; --bad:#F04452;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-en:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans KR",system-ui,sans-serif;
  --f-mono:var(--f-body);
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101013; --surface:#1C1C21; --surface2:#26262C; --ink:#F2F4F6; --muted:#9EA6B1; --line:#2E2E35;
  --accent:#3BB0F0; --accent-ink:#06121C; --accent-soft:#11283A; --navy:#8CC8F5;
  --mark:#14324A; --mark-ink:#BFE5FF;
  --good:#3CCB8E; --warn:#FFA940; --bad:#FF6B76; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101013; --surface:#1C1C21; --surface2:#26262C; --ink:#F2F4F6; --muted:#9EA6B1; --line:#2E2E35;
  --accent:#3BB0F0; --accent-ink:#06121C; --accent-soft:#11283A; --navy:#8CC8F5;
  --mark:#14324A; --mark-ink:#BFE5FF;
  --good:#3CCB8E; --warn:#FFA940; --bad:#FF6B76; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 72px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.3;letter-spacing:-.02em}
h1{font-size:1.85rem;font-weight:800}
h2{font-size:1.3rem}
h3{font-size:1.06rem}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:.85rem;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:6px}
.top .titles{display:grid;gap:4px}
.dday{font-weight:800;font-size:1rem;padding:8px 14px;background:var(--navy);color:var(--surface);border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin:18px 0 22px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:3px;background:var(--line);border-radius:12px;box-shadow:0 0 0 6px var(--bg)}
.tabs button{border:0;background:none;padding:8px 6px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}

.stack{display:grid;gap:16px}
.panel{background:var(--surface);border-radius:var(--r);padding:22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
.stat{display:grid;gap:6px;padding:20px;border-radius:var(--r);background:var(--surface)}
.stat b{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--surface2);padding:11px 18px;border-radius:14px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2)}
.btn.small{padding:8px 12px;font-size:.88rem;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.chip{border:0;background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.9rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.6}
.pill{display:inline-block;font-size:.76rem;padding:3px 10px;border-radius:999px;font-weight:700}
.lv-실전{color:var(--accent);background:var(--accent-soft)}
.lv-기초{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.lv-중급{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.lv-도전{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}

.task{display:flex;gap:12px;align-items:center;padding:12px 0}
.task input{accent-color:var(--accent);width:20px;height:20px;flex:none}
.task .done{color:var(--muted);text-decoration:line-through}
.week{display:grid;gap:2px}
.week h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.week.current{box-shadow:inset 0 0 0 2px var(--accent)}
ol.tips{margin:0;padding-left:1.2em;display:grid;gap:8px;color:var(--ink)}
ol.tips li::marker{color:var(--accent);font-weight:700}

/* flashcard */
.card{min-height:260px;display:grid;place-items:center;text-align:center;padding:36px 22px;border-radius:24px;background:var(--surface);cursor:pointer;user-select:none;position:relative;box-shadow:0 8px 30px rgb(0 40 80 / .06)}
.card .en{font-size:1.9rem;line-height:1.25;font-weight:800;letter-spacing:-.03em}
.card .ko{font-size:1.4rem;margin-top:12px;color:var(--accent);font-weight:700}
.card .ex{color:var(--muted);margin-top:14px;max-width:46ch;font-size:.95rem}
.card .exko{color:var(--ink);margin-top:6px;max-width:46ch;font-size:.95rem;font-weight:500}
.card .cat{position:absolute;top:16px;left:18px;font-size:.8rem;color:var(--muted);font-weight:600}
.card .hint{position:absolute;bottom:14px;left:0;right:0;font-size:.8rem;color:var(--muted)}
.card .state{position:absolute;top:18px;right:18px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.known{background:var(--good)} .dot.again{background:var(--warn)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-weight:600;color:var(--muted);font-size:.8rem}
td.en{font-weight:600}
input[type="search"],input[type="date"],input[type="text"],select,textarea{border:0;background:var(--surface2);border-radius:12px;padding:11px 14px}
textarea{width:100%;min-height:160px;resize:vertical;line-height:1.75}
details summary{cursor:pointer;list-style-position:inside}

/* passage list */
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.plist{grid-template-columns:1fr}}
.pcard{display:grid;gap:8px;text-align:left;padding:20px;border-radius:var(--r);border:0;background:var(--surface);cursor:pointer}
.pcard:hover{box-shadow:0 6px 20px rgb(0 40 80 / .08)}
.pcard:active{transform:scale(.99)}
.pcard h3{font-size:1rem;line-height:1.45}
.status{font-size:.84rem;color:var(--muted);font-weight:600}
.status.ok{color:var(--good)}

/* abstract */
.journal{background:var(--surface);border-radius:var(--r);padding:26px 24px;display:grid;gap:14px}
.journal .jhead{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:.8rem;color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.journal .abs{font-family:var(--f-en);font-size:1.12rem;line-height:1.9;letter-spacing:0}
.journal .kw{font-size:.9rem;color:var(--muted)}
.journal .kw b{color:var(--ink)}
@media (max-width:600px){.journal{padding:20px 18px}.journal .abs{font-size:1.04rem}}
.sent{border-radius:4px}
.sent.on{background:var(--accent-soft)}
.term{all:unset;cursor:pointer;border-bottom:1.5px dotted var(--muted)}
.hints .term{background:var(--mark);color:var(--mark-ink);border-bottom:0;padding:1px 4px;border-radius:6px;font-weight:600}
.term:focus-visible{outline:2px solid var(--accent)}
.pop{position:absolute;z-index:20;max-width:280px;background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:14px;font-size:.9rem;box-shadow:0 10px 30px rgb(0 0 0 / .2)}
.timer{font-variant-numeric:tabular-nums;min-width:3.4em;display:inline-block;font-weight:700}

.pairs{display:grid}
.pair{display:grid;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair .pe{color:var(--muted);font-size:.94rem}
.pair .pk{font-weight:600;font-size:1.02rem}
.reveal{all:unset;cursor:pointer;color:var(--accent);font-size:.9rem;font-weight:700}

.fb{display:grid;gap:14px;padding-top:6px}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-size:2.6rem;font-weight:800;color:var(--accent);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fix{display:grid;gap:4px;padding:12px 14px;background:var(--surface2);border-radius:14px}
.fix s{color:var(--bad)}
.fix ins{color:var(--good);text-decoration:none;font-weight:700}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:4px}
.selfeval{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.selfeval .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.note{font-size:.88rem;color:var(--muted)}
.err{color:var(--bad);font-size:.9rem;font-weight:600}
.thinking{color:var(--muted)}

.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;align-items:end;height:100px}
.days div{background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px}
.days div.zero{background:var(--surface2)}
.daylab{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;font-size:.7rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
/* my research: draft-paper look so it never reads as published research */
.draft{background:var(--surface);border-radius:var(--r);padding:22px;box-shadow:inset 0 0 0 1.5px var(--navy);background-image:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--navy) 7%,transparent) 31px 32px)}
.drafttag{display:inline-flex;gap:6px;align-items:center;font-size:.76rem;font-weight:800;color:var(--surface);background:var(--navy);padding:4px 10px;border-radius:999px}
.tag-theory{font-size:.76rem;font-weight:800;color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);padding:4px 10px;border-radius:999px;display:inline-block}
.tag-fake{font-size:.76rem;font-weight:800;color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent);padding:4px 10px;border-radius:999px;display:inline-block}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;background:var(--line);border-radius:12px}
.seg button{border:0;background:none;padding:9px 6px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.rq{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.rq:first-child{border-top:0}
.rq .en{color:var(--muted);font-size:.94rem}
.kwrow{display:flex;flex-wrap:wrap;gap:6px}
.kw2{background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:.88rem}
.kw2 b{font-weight:700}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));font-size:.9rem}
.qa{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.qa:first-child{border-top:0}
@media (max-width:420px){.tabs button{font-size:.8rem;padding:8px 2px}}
.savebar{margin-top:32px;font-size:.82rem;color:var(--muted);text-align:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-radius:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.btn:active,.pcard:active{transform:none}}
</style>

<div class="wrap">
  <header class="top">

 s:[["This study analyzes how local governments in Korea have implemented the Lifelong Learning City project since its introduction in 2001.","본 연구는 2001년 도입 이후 한국의 지방자치단체가 평생학습도시 사업을 어떻게 추진해 왔는지 분석한다."],
 ["Drawing on policy documents and interviews with twelve lifelong educators, the study identifies the key factors that have shaped the sustainability of the project.","정책 문서와 평생교육사 12명과의 면담 자료를 바탕으로, 본 연구는 사업의 지속가능성에 영향을 미쳐 온 핵심 요인을 도출하였다."],
 ["The analysis revealed three factors: the commitment of local leadership, networks among community learning institutions, and the active participation of residents.","분석 결과, 지역 리더십의 의지, 지역 학습기관 간 네트워크, 주민의 적극적인 참여라는 세 가지 요인이 확인되었다."],
 ["However, frequent changes in administration and a reliance on short-term performance indicators were found to hinder long-term development.","그러나 잦은 행정 교체와 단기 성과지표에 대한 의존은 장기적 발전을 저해하는 것으로 나타났다."],
 ["The study concludes with policy recommendations for building a sustainable learning city grounded in residents' everyday lives.","끝으로 주민의 일상에 뿌리내린 지속가능한 학습도시 구축을 위한 정책적 제언을 제시하였다."]]},
{id:"p5",level:"중급",topic:"노인 디지털 리터러시",title:"지역사회 기반 디지털 리터러시 프로그램이 노인의 디지털 역량과 삶의 만족도에 미치는 효과",
 s:[["As digital transformation accelerates, the digital divide among older adults has emerged as a pressing issue in lifelong education.","디지털 전환이 가속화됨에 따라 노인 간 디지털 격차는 평생교육의 시급한 과제로 떠올랐다."],
 ["This study examined the effects of a community-based digital literacy program on older adults' digital competence and life satisfaction.","본 연구는 지역사회 기반 디지털 리터러시 프로그램이 노인의 디지털 역량과 삶의 만족도에 미치는 효과를 검증하였다."],
 ["A quasi-experimental design was used with an experimental group of 34 participants and a control group of 31 participants.","실험집단 34명과 통제집단 31명을 대상으로 준실험설계를 적용하였다."],
 ["The experimental group showed significantly greater improvement in digital competence than the control group, whereas no significant difference was found in life satisfaction.","실험집단은 통제집단에 비해 디지털 역량이 유의하게 더 향상되었으나, 삶의 만족도에서는 유의한 차이가 나타나지 않았다."],
 ["Based on these results, the study discusses the need for follow-up support that connects digital skills to learners' daily lives.","이러한 결과를 바탕으로, 디지털 기술을 학습자의 일상생활과 연결하는 후속 지원의 필요성을 논의하였다."]]},
{id:"p6",level:"중급",topic:"성인학습자 참여 장애요인",title:"대학 학위과정 성인학습자의 참여 장애요인과 학습지속의향",
 s:[["This study investigated the barriers to participation perceived by adult learners enrolled in university degree programs.","본 연구는 대학 학위과정에 재학 중인 성인학습자가 인식하는 참여 장애요인을 조사하였다."],
 ["Situational, institutional, and dispositional barriers were measured, and their effects on learning persistence were analyzed.","상황적, 기관적, 성향적 장애요인을 측정하고, 이들이 학습지속의향에 미치는 영향을 분석하였다."],
 ["Institutional barriers, such as inflexible class schedules, had the strongest negative effect on learning persistence.","경직된 수업 시간표와 같은 기관적 장애요인이 학습지속의향에 가장 강한 부적 영향을 미쳤다."],
 ["Furthermore, social support from family and colleagues moderated the effect of situational barriers.","나아가 가족과 동료의 사회적 지원은 상황적 장애요인의 영향을 조절하는 것으로 나타났다."],
 ["The findings call for more flexible institutional arrangements that reflect the life circumstances of adult learners.","이러한 결과는 성인학습자의 생활 여건을 반영한 보다 유연한 제도적 장치가 필요함을 보여준다."]]},
{id:"p7",level:"도전",topic:"교회 평생교육 · 신앙 기반 학습공동체",title:"개신교 교회 평생교육 프로그램의 특성과 공동체 형성",
 s:[["Although religious institutions have long served as important sites of adult learning in Korean society, they have received relatively little attention in lifelong education research.","종교기관은 한국 사회에서 오랫동안 성인학습의 중요한 장으로 기능해 왔음에도, 평생교육 연구에서는 상대적으로 주목을 덜 받아 왔다."],
 ["This study investigates the characteristics of lifelong education programs offered by Protestant churches and examines how they contribute to the formation of community.","본 연구는 개신교 교회가 제공하는 평생교육 프로그램의 특성을 살펴보고, 이 프로그램이 공동체 형성에 어떻게 기여하는지 검토한다."],
 ["A mixed-methods design was adopted, combining a survey of 238 program participants with focus group interviews.","연구 방법으로는 프로그램 참여자 238명 대상 설문조사와 포커스그룹 인터뷰를 결합한 혼합연구 설계를 채택하였다."],
 ["The findings indicated that participants valued not only the acquisition of knowledge but also the relationships and sense of belonging that emerged through learning together.","연구 결과, 참여자들은 지식 습득뿐 아니라 함께 배우는 과정에서 형성된 관계와 소속감을 중요하게 여기는 것으로 나타났다."],
 ["Programs that encouraged dialogue and critical reflection were associated with higher levels of civic engagement beyond the church.","대화와 비판적 성찰을 장려하는 프로그램은 교회 밖에서의 더 높은 시민참여 수준과 관련이 있었다."],
 ["These results highlight the potential of faith-based learning communities as a resource for building a learning society.","이러한 결과는 신앙 기반 학습공동체가 학습사회 구축을 위한 자원으로서 지닌 가능성을 보여준다."]]},
{id:"p8",level:"도전",topic:"평생교육사 전문직 정체성",title:"평생교육사의 전문직 정체성 형성 과정에 관한 근거이론 연구",
 s:[["This study aims to develop a grounded theory of how lifelong educators construct their professional identity in the field.","본 연구는 평생교육사가 현장에서 전문직 정체성을 어떻게 구성해 가는지에 관한 근거이론을 개발하는 것을 목적으로 한다."],
 ["In-depth interviews were conducted with fifteen lifelong educators working in local government agencies, universities, and civic organizations.","지방자치단체, 대학, 시민단체에서 근무하는 평생교육사 15명을 대상으로 심층면담을 실시하였다."],
 ["Data were analyzed through open, axial, and selective coding.","자료는 개방코딩, 축코딩, 선택코딩의 과정을 거쳐 분석하였다."],
 ["The core category was identified as 'navigating between administrative demands and educational values.'","핵심범주는 '행정적 요구와 교육적 가치 사이에서 길 찾기'로 도출되었다."],
 ["Participants strengthened their identity through reflective practice and communities of practice, despite unstable employment conditions.","연구참여자들은 불안정한 고용 여건 속에서도 성찰적 실천과 실천공동체를 통해 자신의 정체성을 강화해 나갔다."],
 ["The study offers implications for the professional development and policy support of lifelong educators.","본 연구는 평생교육사의 전문성 개발과 정책적 지원에 대한 시사점을 제공한다."]]},
{id:"p9",level:"기초",topic:"학습동아리와 지역사회",title:"학습동아리 참여와 주민의 지역사회 참여",
 s:[["This study explores how participation in learning clubs affects residents' community involvement.","본 연구는 학습동아리 참여가 주민의 지역사회 참여에 어떠한 영향을 미치는지 탐색한다."],
 ["Data were collected through interviews with ten members of learning clubs supported by a local lifelong learning center.","지역 평생학습관의 지원을 받는 학습동아리 회원 10명을 대상으로 면담을 실시하여 자료를 수집하였다."],
 ["The findings showed that members first joined the clubs for personal interest, but gradually began to share what they had learned with their neighbors.","연구 결과, 회원들은 처음에는 개인적인 관심으로 동아리에 참여하였으나, 점차 자신이 배운 것을 이웃과 나누기 시작한 것으로 나타났다."],
 ["Some clubs developed into volunteer groups that addressed local problems.","일부 동아리는 지역 문제를 해결하는 자원봉사 모임으로 발전하였다."],
 ["The study suggests that learning clubs can serve as a bridge between individual learning and community development.","본 연구는 학습동아리가 개인의 학습과 지역사회 발전을 잇는 가교 역할을 할 수 있음을 시사한다."]]},
{id:"p10",level:"기초",topic:"경력단절여성 재취업 교육",title:"직업훈련에 참여한 경력단절여성의 학습경험",
 s:[["The purpose of this study is to examine the learning experiences of career-break women who participated in a job training program.","본 연구의 목적은 직업훈련 프로그램에 참여한 경력단절여성의 학습경험을 살펴보는 것이다."],
 ["In-depth interviews were conducted with seven women in their late thirties and forties.","30대 후반에서 40대 여성 7명을 대상으로 심층면담을 실시하였다."],
 ["Participants reported that the program helped them regain confidence as well as acquire new skills.","연구참여자들은 프로그램이 새로운 기술을 익히는 데뿐 아니라 자신감을 되찾는 데에도 도움이 되었다고 보고하였다."],
 ["However, they also faced difficulties in balancing learning with family responsibilities.","그러나 이들은 학습과 가족 돌봄의 책임을 병행하는 데 어려움을 겪기도 하였다."],
 ["Based on these results, the study proposes flexible schedules and childcare support for women's reemployment education.","이러한 결과를 바탕으로, 본 연구는 여성 재취업 교육을 위한 유연한 일정 운영과 돌봄 지원을 제안한다."]]},
{id:"p11",level:"기초",topic:"장애인 평생교육",title:"장애 성인의 평생교육 참여 장애요인",
 s:[["Although the Lifelong Education Act guarantees learning opportunities for all citizens, adults with disabilities still have limited access to lifelong education.","평생교육법은 모든 국민의 학습기회를 보장하고 있지만, 장애 성인은 여전히 평생교육에 대한 접근이 제한되어 있다."],
 ["This study investigated the factors that influence the participation of adults with disabilities in lifelong education programs.","본 연구는 장애 성인의 평생교육 프로그램 참여에 영향을 미치는 요인을 조사하였다."],
 ["A survey was conducted with 305 adults with disabilities living in Seoul.","서울에 거주하는 장애 성인 305명을 대상으로 설문조사를 실시하였다."],
 ["The results indicated that transportation, the cost of programs, and a lack of information were the main barriers to participation.","분석 결과, 교통, 프로그램 비용, 정보 부족이 주요 참여 장애요인으로 나타났다."],
 ["The study calls for accessible learning environments and customized support for learners with disabilities.","본 연구는 장애 학습자를 위한 접근 가능한 학습환경과 맞춤형 지원이 필요함을 제기한다."]]},
{id:"p12",level:"기초",topic:"은퇴 후 자원봉사와 학습",title:"은퇴한 베이비붐 세대의 자원봉사 학습경험",
 s:[["As baby boomers enter retirement, there is growing interest in how they make meaning of later life.","베이비붐 세대가 은퇴기에 접어들면서, 이들이 노년기의 삶에 어떻게 의미를 부여하는지에 대한 관심이 높아지고 있다."],
 ["This study explored the learning experiences of retirees who participated in volunteering after retirement.","본 연구는 은퇴 후 자원봉사에 참여한 은퇴자들의 학습경험을 탐색하였다."],
 ["Using a phenomenological approach, the researcher interviewed nine retirees aged 60 to 68.","연구자는 현상학적 접근을 활용하여 60세에서 68세 사이의 은퇴자 9명을 면담하였다."],
 ["Participants described volunteering as a new space for learning, where they discovered new roles and relationships.","연구참여자들은 자원봉사를 새로운 역할과 관계를 발견하는 새로운 학습의 장으로 묘사하였다."],
 ["These findings imply that lifelong education should support older adults in connecting learning with social contribution.","이러한 결과는 평생교육이 노인의 학습과 사회공헌을 연결하도록 지원해야 함을 시사한다."]]},
{id:"p13",level:"중급",topic:"평생학습 참여 결정요인",title:"한국 성인의 평생학습 참여 결정요인 분석",
 s:[["This study analyzed the determinants of adults' participation in lifelong learning using data from the Korean Adult Lifelong Learning Survey.","본 연구는 한국 성인 평생학습 실태조사 자료를 활용하여 성인의 평생학습 참여 결정요인을 분석하였다."],
 ["Logistic regression analysis was performed on a sample of 9,800 adults aged 25 to 79.","25세에서 79세 성인 9,800명의 표본을 대상으로 로지스틱 회귀분석을 실시하였다."],
 ["The results showed that educational attainment, household income, and employment status were significant predictors of participation.","분석 결과, 학력, 가구소득, 고용상태가 참여를 유의하게 예측하는 변인으로 나타났다."],
 ["In particular, adults with lower educational attainment were less likely to participate in non-formal education, even when other variables were controlled.","특히 학력이 낮은 성인은 다른 변인을 통제한 후에도 비형식교육에 참여할 가능성이 더 낮았다."],
 ["These findings suggest that the gap in lifelong learning participation may reinforce existing educational inequality.","이러한 결과는 평생학습 참여 격차가 기존의 교육 불평등을 강화할 수 있음을 시사한다."],
 ["The study discusses policy measures to expand learning opportunities for low-income and less-educated adults.","본 연구는 저소득·저학력 성인의 학습기회를 확대하기 위한 정책 방안을 논의하였다."]]},
{id:"p14",level:"중급",topic:"온라인 학습과 학습몰입",title:"온라인 강좌 성인학습자의 자기효능감, 사회적 실재감, 학습몰입, 학습만족의 관계",
 s:[["With the expansion of online learning platforms such as MOOCs, understanding adult learners' engagement in online environments has become increasingly important.","MOOC와 같은 온라인 학습 플랫폼이 확대되면서, 온라인 환경에서 성인학습자의 학습참여를 이해하는 것이 점점 더 중요해졌다."],
 ["This study examined the effects of self-efficacy and social presence on learning flow and learning satisfaction among adult learners in online courses.","본 연구는 온라인 강좌를 수강하는 성인학습자의 자기효능감과 사회적 실재감이 학습몰입과 학습만족에 미치는 영향을 검증하였다."],
 ["Data from 356 adult learners were analyzed using structural equation modeling.","성인학습자 356명의 자료를 구조방정식모형으로 분석하였다."],
 ["Self-efficacy had a direct effect on learning satisfaction, and social presence influenced learning satisfaction indirectly through learning flow.","자기효능감은 학습만족에 직접적인 영향을 미쳤으며, 사회적 실재감은 학습몰입을 매개로 학습만족에 간접적인 영향을 미쳤다."],
 ["These results highlight the importance of designing interactive online courses that foster a sense of connection among learners.","이러한 결과는 학습자 간 연결감을 높이는 상호작용적 온라인 강좌 설계의 중요성을 보여준다."]]},
{id:"p15",level:"중급",topic:"결혼이주여성의 평생학습",title:"결혼이주여성의 평생학습 경험에 관한 내러티브 탐구",
 s:[["This study aims to understand the lifelong learning experiences of marriage migrant women in Korea.","본 연구는 한국에 거주하는 결혼이주여성의 평생학습 경험을 이해하는 것을 목적으로 한다."],
 ["Using narrative inquiry, the study analyzed the life stories of five women who had participated in Korean language and community programs for more than three years.","본 연구는 내러티브 탐구를 활용하여 한국어 및 지역사회 프로그램에 3년 이상 참여한 여성 5명의 생애 이야기를 분석하였다."],
 ["Their learning was initially driven by the need to adapt to daily life, such as communicating with family members and raising children.","이들의 학습은 처음에는 가족과의 의사소통이나 자녀 양육처럼 일상생활에 적응해야 할 필요에서 비롯되었다."],
 ["Over time, however, they began to see themselves not as recipients of support but as active members of the community who could teach others.","그러나 시간이 지나면서 이들은 자신을 지원의 수혜자가 아니라 다른 사람을 가르칠 수 있는 지역사회의 능동적인 구성원으로 인식하기 시작하였다."],
 ["The study suggests that multicultural education programs should move beyond assimilation and recognize migrants' cultural resources.","본 연구는 다문화교육 프로그램이 동화주의를 넘어 이주민이 지닌 문화적 자원을 인정해야 함을 시사한다."]]},
{id:"p16",level:"중급",topic:"평생교육사 역량모델 (델파이)",title:"델파이 기법을 활용한 지방자치단체 평생교육사 역량모델 개발",
 s:[["The purpose of this study was to develop a competency model for lifelong educators working in local governments.","본 연구의 목적은 지방자치단체에서 근무하는 평생교육사의 역량모델을 개발하는 것이다."],
 ["A literature review and in-depth interviews were first conducted to draft the initial competency items.","먼저 문헌연구와 심층면담을 실시하여 초기 역량 항목을 작성하였다."],
 ["Then, a three-round Delphi survey was administered to a panel of twenty experts in lifelong education.","이후 평생교육 전문가 20명으로 구성된 패널을 대상으로 3차에 걸친 델파이 조사를 실시하였다."],
 ["As a result, the final model consisted of four competency clusters and eighteen competencies, including program planning, networking, and needs assessment.","그 결과, 최종 모델은 프로그램 기획, 네트워킹, 요구분석 등을 포함한 4개의 역량군과 18개의 역량으로 구성되었다."],
 ["The content validity of each competency was confirmed by the experts' consensus.","각 역량의 내용타당도는 전문가들의 합의를 통해 확인되었다."],
 ["The model can be used as a basis for the training and evaluation of lifelong educators.","이 모델은 평생교육사의 연수와 평가를 위한 기초 자료로 활용될 수 있다."]]},
{id:"p17",level:"도전",topic:"비판교육학과 성인문해",title:"의식화의 실천으로서 성인문해교육: 한 지역 문해학교 사례",
 s:[["Drawing on Freire's critical pedagogy, this study examines how adult literacy education can function as a practice of conscientization rather than mere skill acquisition.","본 연구는 프레이리의 비판교육학을 바탕으로, 성인문해교육이 단순한 기술 습득이 아니라 의식화의 실천으로 어떻게 기능할 수 있는지 검토한다."],
 ["Participant observation and interviews were conducted over eighteen months in a community literacy school, involving learners, teachers, and activists.","한 지역 문해학교에서 18개월 동안 학습자, 교사, 활동가를 대상으로 참여관찰과 면담을 실시하였다."],
 ["The analysis showed that learners, many of whom had internalized a sense of shame about their lack of schooling, gradually came to interpret their experiences in relation to broader social structures.","분석 결과, 학교교육을 받지 못한 데 대한 수치심을 내면화하고 있던 학습자 상당수가 점차 자신의 경험을 더 넓은 사회구조와 관련지어 해석하게 된 것으로 나타났다."],
 ["Dialogue-based classes, in which learners' own words and life stories became the teaching materials, played a decisive role in this transformation.","학습자 자신의 말과 생애 이야기가 교재가 되는 대화 중심 수업은 이러한 변화에 결정적인 역할을 하였다."],
 ["Nevertheless, the pressure to produce measurable outcomes for funding agencies often conflicted with the pedagogical principles of the school.","그럼에도 불구하고, 지원기관에 측정 가능한 성과를 내야 한다는 압박은 종종 학교의 교육적 원칙과 충돌하였다."],
 ["The study argues that literacy policy should acknowledge the political and emancipatory dimensions of adult learning.","본 연구는 문해정책이 성인학습의 정치적·해방적 차원을 인정해야 한다고 주장한다."]]},
{id:"p18",level:"도전",topic:"세대 간 학습",title:"세대 간 학습 프로그램 참여 경험에 관한 해석학적 현상학 연구",
 s:[["Intergenerational learning programs, in which older adults and young people learn together, have been promoted as a strategy to address age segregation in aging societies.","노인과 청년이 함께 배우는 세대 간 학습 프로그램은 고령사회의 연령 분리 문제에 대응하는 전략으로 장려되어 왔다."],
 ["Yet, little is known about how participants themselves experience and make sense of such encounters.","그러나 참여자들이 그러한 만남을 스스로 어떻게 경험하고 이해하는지는 거의 알려져 있지 않다."],
 ["Adopting a hermeneutic phenomenological approach, this study analyzed interviews with eight older adults and eight university students who had participated in a semester-long intergenerational program.","본 연구는 해석학적 현상학의 접근을 채택하여, 한 학기 동안 세대 간 프로그램에 참여한 노인 8명과 대학생 8명의 면담 자료를 분석하였다."],
 ["Four themes emerged: dismantling stereotypes, negotiating differences in communication, reciprocal teaching, and rediscovering one's own life stage.","분석 결과 고정관념 해체, 의사소통 방식의 차이 조율, 상호 가르침, 자신의 생애단계 재발견이라는 네 가지 주제가 도출되었다."],
 ["Notably, both groups reported that encountering the other generation prompted them to reflect on their own aging and future.","주목할 점은 두 집단 모두 다른 세대와의 만남을 계기로 자신의 노화와 미래를 성찰하게 되었다고 보고한 것이다."],
 ["These findings suggest that intergenerational learning can be understood not merely as an exchange of knowledge but as a mutual process of identity reconstruction.","이러한 결과는 세대 간 학습이 단순한 지식 교환이 아니라 정체성을 함께 재구성해 가는 상호적 과정으로 이해될 수 있음을 시사한다."]]},
{id:"p19",level:"도전",topic:"자기주도학습 메타분석",title:"자기주도학습과 학습성과의 관계에 대한 메타분석",
 s:[["Although numerous studies have reported positive associations between self-directed learning and various learning outcomes, their findings have been inconsistent in magnitude.","자기주도학습과 다양한 학습성과 간의 정적 관련성을 보고한 연구는 많지만, 그 효과의 크기는 일관되지 않았다."],
 ["This meta-analysis synthesized 64 empirical studies published in Korean academic journals between 2005 and 2024.","본 메타분석은 2005년부터 2024년까지 국내 학술지에 게재된 실증연구 64편을 종합하였다."],
 ["Using a random-effects model, the overall correlation between self-directed learning and learning outcomes was found to be moderate (r = .41).","무선효과모형을 적용한 결과, 자기주도학습과 학습성과 간의 전체 상관은 중간 수준(r = .41)으로 나타났다."],
 ["Moderator analyses revealed that effect sizes were larger for affective outcomes, such as satisfaction and motivation, than for cognitive outcomes, such as achievement.","조절변인 분석 결과, 효과크기는 성취도와 같은 인지적 성과보다 만족도와 동기 같은 정의적 성과에서 더 크게 나타났다."],
 ["In addition, studies of adult learners yielded larger effect sizes than those of adolescents.","또한 성인학습자를 대상으로 한 연구가 청소년 대상 연구보다 더 큰 효과크기를 보였다."],
 ["Implications for future research, including the need for longitudinal designs and objective outcome measures, are discussed.","종단적 설계와 객관적 성과 측정의 필요성을 포함하여 후속연구를 위한 시사점을 논의하였다."]]},
{id:"p20",level:"도전",topic:"AI 시대 일터학습과 리스킬링",title:"근로자의 일터학습 참여에 영향을 미치는 개인 및 조직 요인: 다층분석",
 s:[["As artificial intelligence transforms the nature of work, organizations are increasingly expected to provide reskilling opportunities for their employees.","인공지능이 일의 성격을 변화시키면서, 조직은 구성원에게 재교육 기회를 제공하도록 점점 더 요구받고 있다."],
 ["This study examined how individual and organizational factors jointly influence employees' participation in workplace learning.","본 연구는 개인 요인과 조직 요인이 구성원의 일터학습 참여에 어떻게 함께 영향을 미치는지 검증하였다."],
 ["Multilevel analysis was performed on data from 2,140 employees nested within 186 companies, drawn from the Human Capital Corporate Panel.","인적자본기업패널에서 추출한 186개 기업 소속 근로자 2,140명의 자료를 대상으로 다층분석을 실시하였다."],
 ["At the individual level, learning motivation and perceived career prospects were positively associated with participation, whereas age showed a negative association.","개인 수준에서는 학습동기와 지각된 경력 전망이 참여와 정적인 관련을 보인 반면, 연령은 부적인 관련을 보였다."],
 ["At the organizational level, a supportive learning culture not only increased participation directly but also weakened the negative effect of age.","조직 수준에서는 지원적인 학습문화가 참여를 직접 높였을 뿐 아니라 연령의 부정적 영향도 완화하였다."],
 ["These results indicate that reskilling policies should target organizational learning environments as well as individual motivation, particularly for older workers.","이러한 결과는 재교육 정책이 특히 고령 근로자를 위해 개인의 동기뿐 아니라 조직의 학습환경까지 겨냥해야 함을 보여준다."]]},
{id:"m1",rid:"r1",level:"중급",topic:"내 연구안 1 · 부모됨 이전 단계",title:"예비부모와 신혼부부의 학습요구와 부모정체성 형성 (가상 연습 지문)",
 s:[["Becoming a parent is a major life transition that reshapes one's identity, marital relationship, and values about family.","부모가 되는 것은 개인의 정체성, 부부관계, 가족에 대한 가치관을 재구성하는 중요한 생애전환이다."],
 ["However, existing parent education has focused largely on pregnancy, childbirth, and child-rearing skills, paying little attention to the learning of adults before parenthood.","그러나 기존의 부모교육은 주로 임신, 출산, 양육기술에 초점을 맞추어 왔으며, 부모가 되기 이전 성인의 학습에는 거의 주목하지 않았다."],
 ["This study explored the learning needs of prospective parents and newlywed couples and examined how parental identity is formed from the perspective of adult learning.","본 연구는 예비부모와 신혼부부의 학습요구를 탐색하고, 성인학습의 관점에서 부모정체성이 어떻게 형성되는지 살펴보았다."],
 ["In-depth interviews with fourteen participants revealed that reflecting on their family-of-origin experiences and conflict styles was a central part of preparing for parenthood.","연구참여자 14명과의 심층면담 결과, 원가족 경험과 갈등방식을 성찰하는 것이 부모됨 준비의 핵심적인 부분인 것으로 나타났다."],
 ["Couples also negotiated their views on family values and parental roles through ongoing dialogue.","또한 부부는 지속적인 대화를 통해 가족가치와 부모역할에 대한 관점을 조율해 나갔다."],
 ["The findings suggest that parent education should be reconceptualized as a process of adult growth and learning rather than a set of child-rearing techniques.","이러한 결과는 부모교육이 양육기술의 집합이 아니라 성인의 성장과 학습의 과정으로 재개념화되어야 함을 시사한다."]]},
{id:"m2",rid:"r2",level:"중급",topic:"내 연구안 2 · 무전공·자유전공",title:"무전공 대학생의 전공선택 과정과 진로정체성 (가상 연습 지문)",
 s:[["As Korean universities expand undeclared and liberal studies admissions, students are increasingly required to explore and choose their majors after enrollment.","한국 대학이 무전공·자유전공 입학을 확대함에 따라, 학생들은 입학 이후 스스로 전공을 탐색하고 선택해야 하는 경우가 늘고 있다."],
 ["This study examined how undeclared students explore and decide on their majors, focusing on self-understanding and career identity.","본 연구는 무전공 학생들이 전공을 어떻게 탐색하고 결정하는지를 자기이해와 진로정체성을 중심으로 살펴보았다."],
 ["A qualitative study was conducted through in-depth interviews with ten undeclared students in their first and second years.","1, 2학년 무전공 학생 10명을 대상으로 심층면담을 실시하는 질적 연구를 수행하였다."],
 ["The findings revealed that choosing a major was not a single decision but a learning process in which students questioned their interests, gathered information, and reinterpreted their experiences.","연구 결과, 전공선택은 단 한 번의 결정이 아니라 학생들이 자신의 흥미를 묻고, 정보를 수집하며, 자신의 경험을 재해석하는 학습과정인 것으로 나타났다."],
 ["Professors, senior students, and parents, as well as institutional information, played distinct roles in this process.","이 과정에서 교수, 선배, 부모와 대학의 제도적 정보는 각기 다른 역할을 하였다."],
 ["The study provides implications for designing major exploration and career development programs in universities.","본 연구는 대학의 전공탐색 및 진로개발 프로그램 설계에 대한 시사점을 제공한다."]]},
{id:"m3",rid:"r3",level:"도전",topic:"내 연구안 3 · 대학생 자기이해",title:"대학 신입생의 자기이해 학습경험과 진로정체성 (가상 연습 지문)",
 s:[["While many universities offer liberal arts courses on college life and career planning, little is known about how self-understanding is actually formed through such education.","많은 대학이 대학생활과 진로설계에 관한 교양과목을 운영하고 있지만, 이러한 교육을 통해 자기이해가 실제로 어떻게 형성되는지에 대해서는 알려진 바가 많지 않다."],
 ["Viewing self-understanding not as the result of a psychological test but as a learning process of interpreting one's experiences, this study explored how first-year students construct their career identity.","본 연구는 자기이해를 심리검사의 결과가 아니라 자신의 경험을 해석하는 학습과정으로 보고, 대학 신입생이 진로정체성을 어떻게 구성해 가는지 탐색하였다."],
 ["Data were collected from interviews and reflective journals of twelve students enrolled in a career and life design course.","진로·생애설계 교과목을 수강한 학생 12명의 면담과 성찰일지를 통해 자료를 수집하였다."],
 ["Students' self-understanding shifted from describing themselves through external labels, such as test results and grades, to articulating their own values and meanings.","학생들의 자기이해는 검사 결과나 성적과 같은 외부의 이름표로 자신을 설명하는 데에서 자신의 가치와 의미를 스스로 표현하는 방향으로 변화하였다."],
 ["Opportunities for narrative reflection and dialogue with peers were identified as key learning experiences that facilitated this shift.","서사적 성찰의 기회와 동료와의 대화는 이러한 변화를 촉진한 핵심 학습경험으로 확인되었다."],
 ["These findings highlight the need to redesign university general education from the perspective of lifelong learning and life design.","이러한 결과는 평생학습과 생애설계의 관점에서 대학 교양교육을 재설계할 필요성을 보여준다."]]},
];

const COMMON_Q = ["생애의 중요한 전환과 선택을 앞둔 개인은 자신을 어떻게 이해하고, 경험을 어떻게 학습하며, 삶의 방향과 정체성을 어떻게 형성하는가?",
  "How do individuals facing important life transitions and choices understand themselves, learn from their experiences, and shape the direction and identity of their lives?"];
const RESEARCH = [
{id:"r1",search:["예비부모교육","부모됨 성인학습","부모정체성","예비부부 교육프로그램","원가족 경험 부부관계"],short:"부모됨 이전",title:"부모됨 이전 단계 성인의 학습요구와 부모정체성 형성에 관한 연구",sub:"생애전환 및 성인학습의 관점을 중심으로",
 en:"A Study on the Learning Needs and Parental Identity Formation of Adults before Parenthood: From the Perspectives of Life Transition and Adult Learning",
 target:"예비부모·신혼부부 / 가족형성",
 purpose:"부모됨을 준비하는 성인이 필요로 하는 학습내용을 탐색하고, 부모정체성이 형성되는 과정을 성인학습과 생애전환의 관점에서 설명한다. 장기적으로는 자기이해-원가족-부부관계-부모됨-가족가치를 잇는 예비부모 교육프로그램 개발로 확장한다.",
 rq:[["예비부모 및 초기 부모는 부모가 되기 전에 무엇을 배우고 준비할 필요가 있다고 인식하는가?","What do prospective and new parents perceive they need to learn and prepare before becoming parents?"],
  ["부모됨을 준비하는 과정에서 자기이해와 원가족 경험의 성찰은 어떠한 의미를 갖는가?","What does reflecting on self-understanding and family-of-origin experiences mean in preparing for parenthood?"],

async function initStore(){
  const local = loadLocal();
  if (local) S = local;
  renderAll();
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    store.ref = ref; store.kind = "db";
    if (snap.exists) {
      S = Object.assign(blank(), JSON.parse(JSON.stringify(snap.data())));
      lsSet(LS_KEY, JSON.stringify(S));
      setSaveLabel("내 계정에 저장됨 · 다른 기기에서도 이어서 할 수 있어요");
      renderAll();
    } else if (local) { save(); }
    else setSaveLabel("내 계정에 저장돼요 · 다른 기기에서도 이어서 할 수 있어요");
  } catch { /* stay local */ }
}

function daysLeft(){
  if (!S.interview) return null;
  const [y,m,d] = S.interview.split("-").map(Number);
  const a = new Date(y, m-1, d), b = new Date(); b.setHours(0,0,0,0);
  return Math.round((a - b) / 86400000);
}
function streak(){
  let n = 0; const d = new Date();
  const active = k => { const x = S.days[k]; return x && ((x.t||0) + (x.p||0)) > 0; };
  if (!active(dkey(d))) d.setDate(d.getDate() - 1);
  while (active(dkey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function currentWeek(){
  const left = daysLeft();
  if (left == null || left < 0) return null;
  if (left > 21) return 1; if (left > 14) return 2; if (left > 7) return 3; return 4;
}

function buildHL(extra){
  const list = [...T, ...(extra || []).filter(x => x && x.en && !T.some(t => t.en.toLowerCase() === x.en.toLowerCase()))
    .map(x => ({en:x.en, ko:x.ko, cat:"이 지문 용어", src:reEsc(x.en), full:new RegExp("^"+reEsc(x.en)+"$","i")}))];
  const srcs = list.map(t => t.src).sort((a,b) => b.length - a.length);
  return {list, re:new RegExp("\\b(?:" + srcs.join("|") + ")\\b", "gi")};
}
function hl(text, H){
  let out = "", last = 0, m; H.re.lastIndex = 0;
  while ((m = H.re.exec(text))) {
    if (!m[0]) { H.re.lastIndex++; continue; }
    const t = H.list.find(x => x.full.test(m[0]));
    out += esc(text.slice(last, m.index));
    out += t ? `<button class="term" data-en="${esc(t.en)}" data-ko="${esc(t.ko)}" data-cat="${esc(t.cat)}">${esc(m[0])}</button>` : esc(m[0]);
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

async function genPassage({topic, level, out, btn, rid}){
  const sample = await getSample(); if (!sample) { out.innerHTML = `<span class="err">이 화면에서는 Claude를 쓸 수 없어요.</span>`; return; }

  const n = {기초:4, 중급:5, 도전:6}[level];
  const prompt = `한국 평생교육학 학술지(평생학습사회, 평생교육학연구, Andragogy Today)의 영문 초록 스타일로 연습용 영문 초록을 새로 작성하라. 실존 논문을 베끼지 말고 그럴듯한 가상의 연구로 작성한다.
주제: ${topic}
난이도: ${level} (기초: 쉬운 구문, 짧은 문장 / 중급: 일반적인 학술 문장 / 도전: 긴 복문, 수동태, 분사구문, 양보절 포함)
문장 수: 정확히 ${n}문장. 목적 → 방법 → 결과 → 시사점 구조.
각 문장마다 자연스러운 학술 한국어 번역을 붙인다(국문 초록 문체: ~하였다, ~나타났다, ~시사한다).
JSON만 답하라: {"title":"한국어 논문 제목","sentences":[{"en":"...","ko":"..."}],"terms":[{"en":"원문에 나온 그대로의 영어 전공용어","ko":"한국어"}]}
terms는 5~8개.`;
  try {
    const r = await sample.json(prompt, {signal:genCtl.signal, cache:false});
    const s = (r?.sentences || []).filter(x => x && x.en && x.ko).map(x => [String(x.en), String(x.ko)]);
    if (!s.length) throw {code:"invalid_json"};
    const p = {id:"g"+Date.now(), level, topic, title:String(r.title || topic) + (rid ? " (가상 연습 지문)" : ""), s, terms:(r.terms || []).filter(x => x && x.en && x.ko).map(x => ({en:String(x.en), ko:String(x.ko)})), ai:true};
    if (rid) p.rid = rid;
    S.gen.push(p); if (S.gen.length > 40) S.gen.shift(); save();
    openPassage(p.id, rid ? "mine" : "read");
  } catch (e) { out.innerHTML = `<span class="err">${esc(errCopy(e))}</span>`; btn.disabled = false; }
}

const mmss = s => String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
function tick(){ const t = $("#timerTxt"); if (t) t.textContent = mmss(Math.floor((Date.now() - timerStart) / 1000)); }
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo({top:y}); }
let lastFb = null;

function selfEval(p, v){
  const secs = timerId || timerStart ? Math.floor((Date.now() - timerStart) / 1000) : 0;
  stopTimer();
  const already = S.done[p.id] && S.done[p.id].date === today();
  S.done[p.id] = {date:today(), self:v};
  const last = S.attempts[S.attempts.length - 1];
  if (last && last.pid === p.id && last.date === today() && last.self == null) { last.self = v; if (!last.secs && secs) last.secs = secs; }
  else S.attempts.push({pid:p.id, date:today(), self:v, secs: secs && secs < 7200 ? secs : 0});
  if (S.attempts.length > 200) S.attempts = S.attempts.slice(-200);
  if (!already) bump("p");
  timerStart = 0;
  save(); keepScroll(renderPractice);
}

${p.koFull || p.s.map(x => x[1]).join(" ")}

[지원자 해석]
${mine.slice(0, 4000)}`;
  try {

      <div class="row between"><span class="tag-fake">가상 지문 · 이 주제로 해석 연습</span></div>
      <div class="plist">${ps.map(p => { const d = S.done[p.id]; return `<button class="pcard" data-mp="${p.id}">
        <div class="row between"><span class="pill lv-${esc(p.level)}">${esc(p.level)}</span><span class="small muted">${p.ai ? "Claude가 만듦" : "기본 제공"}</span></div>
        <h3>${esc(p.title)}</h3>
        <span class="status ${d ? "ok" : ""}">${d ? `해석함 · ${fmtDate(d.date)}` : "아직 안 함"}</span></button>`; }).join("")}</div>
      <div class="row">
        <select id="mGenLevel" aria-label="난이도"><option>기초</option><option selected>중급</option><option>도전</option></select>
        <button class="btn primary" id="mGenBtn">이 주제로 새 지문 만들기</button>
      </div>
      <div id="mGenOut" class="small"></div>
    </div>

    <div class="panel stack" style="gap:10px">
      <h3>실제 초록 찾을 검색어</h3>
      <p class="small muted">KCI에서 이 검색어로 논문을 찾아 영문·국문 초록을 '초록 해석' 탭의 <b>직접 붙여넣기</b>에 넣으면 연습 지문이 돼요. 누르면 검색어가 복사돼요.</p>
      <div class="kwrow">${r.search.map(q => `<button class="chip" data-copy="${esc(q)}">${esc(q)}</button>`).join("")}</div>
      <div class="row"><a class="btn small" href="https://www.kci.go.kr" target="_blank" rel="noopener">KCI 열기</a><span class="small muted" id="copyNote"></span></div>
    </div>

    <div class="panel stack" style="gap:10px">
      <h3>면접 예상 질문</h3>
      <div>${r.qs.map(([q,a]) => `<div class="qa"><b>Q. ${esc(q)}</b><span class="muted small">${esc(a)}</span></div>`).join("")}</div>
    </div>

    <div class="panel stack" style="gap:10px">
      <div class="row between"><h3>내 연구 용어</h3><span class="small muted num">알아요 ${known} / ${myTerms.length}</span></div>
      <div class="bar"><i style="width:${Math.round(known/myTerms.length*100)}%"></i></div>
      <p class="small muted">부모됨, 무전공, 자기이해, 진로정체성 관련 영어 용어 ${myTerms.length}개를 카드로 넣어 뒀어요.</p>
      <div><button class="btn" id="mTerms">용어 카드로 외우기</button></div>
    </div>
  </div>`;
  $$("[data-r]", el).forEach(b => b.onclick = () => { rSel = b.dataset.r; lsSet("lle-rsel", rSel); renderMine(); });
  $$("[data-copy]", el).forEach(c => c.onclick = async () => {
    const note = $("#copyNote");
    try { await navigator.clipboard.writeText(c.dataset.copy); note.textContent = `'${c.dataset.copy}' 복사됨`; }
    catch { note.textContent = `복사가 안 돼요. 직접 입력해 주세요: ${c.dataset.copy}`; }
  });
  $("#rqEn").onclick = () => { showRqEn = !showRqEn; renderMine(); };
  $("#sayQ").onclick = () => speak(COMMON_Q[1]);
  $$("[data-mp]", el).forEach(b => b.onclick = () => openPassage(b.dataset.mp, "mine"));
  $("#mGenBtn").onclick = () => genPassage({topic:r.topic, level:$("#mGenLevel").value, out:$("#mGenOut"), btn:$("#mGenBtn"), rid:r.id});
  $("#mTerms").onclick = () => { deckCat = "내 연구"; onlyUnknown = false; buildDeck(); showTab("terms"); };
  getSample().then(s => { if (!s) { $("#mGenBtn").hidden = true; $("#mGenLevel").hidden = true; } });
}

// ---------- log ----------
let confirmReset = false;
function renderLog(){
  const el = $("#tab-log");
  const keys = []; const d = new Date(); d.setDate(d.getDate() - 13);
  for (let i = 0; i < 14; i++) { keys.push(dkey(d)); d.setDate(d.getDate() + 1); }
  const vals = keys.map(k => { const x = S.days[k] || {}; return (x.t || 0) + (x.p || 0) * 10; });
  const max = Math.max(10, ...vals);
  const pmap = Object.fromEntries(allPassages().map(p => [p.id, p]));
  const atts = S.attempts.slice().reverse().slice(0, 30);
  el.innerHTML = `
  <div class="stack">
    <div class="panel stack" style="gap:10px">
      <div class="row between"><h3>최근 2주 학습량</h3><span class="small muted">용어 1장 = 1, 지문 1편 = 10</span></div>
      <div class="days" role="img" aria-label="최근 14일 학습량 막대">${vals.map((v,i) => `<div class="${v ? "" : "zero"}" style="height:${v ? Math.max(6, v / max * 100) : 2}%" title="${fmtDate(keys[i])}: 용어 ${(S.days[keys[i]]||{}).t||0} · 지문 ${(S.days[keys[i]]||{}).p||0}"></div>`).join("")}</div>
      <div class="daylab">${keys.map(k => `<span>${fmtDate(k).split("/")[1]}</span>`).join("")}</div>
    </div>

    <div class="panel stack" style="gap:10px">
      <h3>분류별 용어</h3>
      ${CATS.map(c => { const ts = T.filter(t => t.cat === c), k = ts.filter(t => S.terms[t.en] === "known").length, a = ts.filter(t => S.terms[t.en] === "again").length;
        return `<div class="stack" style="gap:4px"><div class="row between small"><span>${esc(c)}</span><span class="num muted">알아요 ${k} · 다시 ${a} · 전체 ${ts.length}</span></div><div class="bar"><i style="width:${Math.round(k/ts.length*100)}%"></i></div></div>`; }).join("")}
    </div>

    <div class="panel stack" style="gap:10px">
      <h3>해석 기록</h3>
      ${atts.length ? `<div class="tablewrap"><table><thead><tr><th>날짜</th><th>지문</th><th>자가평가</th><th>첨삭</th><th>시간</th></tr></thead><tbody>
      ${atts.map(a => `<tr><td class="num">${fmtDate(a.date)}</td><td>${esc(pmap[a.pid]?.title || "삭제한 지문")}</td><td>${["","많이 막힘","조금 막힘","막힘 없이"][a.self] || "-"}</td><td class="num">${a.score != null ? a.score + "/10" : "-"}</td><td class="num">${a.secs ? mmss(a.secs) : "-"}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted">아직 기록이 없어요. '초록 해석' 탭에서 첫 지문을 해석하고 자가평가를 남기면 여기에 쌓여요.</p>`}
    </div>

    <div class="row" id="resetWrap">
      ${confirmReset ? `<div class="confirm"><span class="small">용어, 해석 기록, 계획 체크, 만든 지문이 모두 지워져요.</span><button class="btn small" id="resetYes">모두 지우기</button><button class="btn ghost small" id="resetNo">취소</button></div>`
        : `<button class="btn ghost small" id="resetBtn">기록 초기화</button>`}
    </div>
  </div>`;
  if (confirmReset) {
    $("#resetNo").onclick = () => { confirmReset = false; renderLog(); };
    $("#resetYes").onclick = () => { confirmReset = false; S = blank(); deck = []; save(); renderBadge(); renderLog(); };
  } else $("#resetBtn").onclick = () => { confirmReset = true; renderLog(); };
}

// ---------- boot ----------
showTab(tab);
initStore();
</script>
