ecap="round" opacity=".9"/></g></g></g><ellipse cx="700" cy="532" rx="32.4" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(700 530) scale(0.9 0.9)"><g class="bob"><g class="wag"><path d="M40-40q20-4 16 12q-10 2-6-8" stroke="#F39AAE" stroke-width="5" fill="none" stroke-linecap="round"/></g><rect x="-30" y="-24" width="16" height="24" rx="7" fill="#F39AAE"/><rect x="14" y="-24" width="16" height="24" rx="7" fill="#F39AAE"/><ellipse cy="-46" rx="44" ry="38" fill="#FFB8C6"/><path d="M-40-90L-34-128L-8-106ZM40-90L34-128L8-106Z" fill="#F39AAE"/><circle cy="-96" r="34" fill="#FFB8C6"/><path d="M-30-72q30 14 60 0l-6 10q-24 8-48 0z" fill="#7FB8E6"/><g transform="translate(0 -96) scale(1 1)"><circle cx="-14" cy="-6" r="4" fill="#3A2A22"/><circle cx="14" cy="-6" r="4" fill="#3A2A22"/><ellipse cy="20" rx="4.5" ry="5.5" fill="#B5485A"/><circle cx="-22" cy="4" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="22" cy="4" r="5.5" fill="#FF9AA8" opacity=".55"/></g><ellipse cy="-90" rx="14" ry="10" fill="#F39AAE"/><ellipse cx="-5" cy="-90" rx="2.5" ry="3.5" fill="#B5485A"/><ellipse cx="5" cy="-90" rx="2.5" ry="3.5" fill="#B5485A"/></g></g>
</svg>
