 stroke="#5B6BB5" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M2-136q14 8 8 30M2-136q-2 16-12 26" stroke="#D94A5E" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M-32-150Q-52-118-50-84" stroke="#FFF3DD" stroke-width="22" fill="none" stroke-linecap="round"/><path d="M32-150Q52-118 50-84" stroke="#FFF3DD" stroke-width="22" fill="none" stroke-linecap="round"/><circle cx="-50" cy="-76" r="10" fill="#FFD6B3"/><circle cx="50" cy="-76" r="10" fill="#FFD6B3"/><circle cx="0" cy="-168" r="0"/><ellipse cx="0" cy="-230" rx="0" ry="0"/><circle cy="-196" r="31" fill="#FFD6B3"/><path d="M-31-196C-31-232 31-232 31-196C26-212 12-218 0-216C-12-218-25-212-31-196Z" fill="#2E2A33"/><path d="M0-226v11" stroke="#FFD6B3" stroke-width="2.5" stroke-linecap="round"/><g transform="translate(0 -196) scale(1 1)"><circle cx="-11" cy="0" r="4.5" fill="#3A2A22"/><circle cx="11" cy="0" r="4.5" fill="#3A2A22"/><path d="M-17 -9l10 3M17 -9l-10 3" stroke="#3A2A22" stroke-width="3" stroke-linecap="round"/><path d="M-5 16h10" stroke="#3A2A22" stroke-width="3" stroke-linecap="round"/><circle cx="-19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g><circle cx="30" cy="-212" r="12" fill="#2E2A33"/><path d="M18-214h30" stroke="#E9C46A" stroke-width="4" stroke-linecap="round"/></g></g>
</svg>
