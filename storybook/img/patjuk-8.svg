M118-101l12-12" stroke="#3A2A22" stroke-width="6" stroke-linecap="round"/></g><g class="breathe"><path d="M-68-3C-78-65-56-137 0-145S78-65 68-3Z" fill="#F59A45"/><path d="M-32-3C-38-53-22-95 0-101S38-53 32-3Z" fill="#FFF1D6"/><path d="M-58-65q18-6 28 6M-62-33q18-4 26 8M58-65q-18-6-28 6M62-33q-18-4-26 8" stroke="#3A2A22" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="-46" cy="-5" rx="28" ry="13" fill="#F59A45"/><ellipse cx="46" cy="-5" rx="28" ry="13" fill="#F59A45"/><ellipse cx="16" cy="-7" rx="17" ry="11" fill="#FFE7C7"/><circle cx="-48" cy="-235" r="19" fill="#F59A45"/><circle cx="-48" cy="-235" r="9" fill="#FFC9A0"/><circle cx="46" cy="-235" r="19" fill="#F59A45"/><circle cx="46" cy="-235" r="9" fill="#FFC9A0"/><ellipse cx="-1" cy="-187" rx="68" ry="59" fill="#F59A45"/><path d="M-66-175q-14 8-6 22q8-6 16-4M64-175q14 8 6 22q-8-6-16-4" fill="#FFF1D6"/><ellipse cx="-1" cy="-163" rx="38" ry="27" fill="#FFF1D6"/><path d="M-18-229h34M-15-217h28M-13-206h24M-1-231v26" stroke="#3A2A22" stroke-width="6" stroke-linecap="round"/><path d="M-64-199q14 2 20 12M62-199q-14 2-20 12" stroke="#3A2A22" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="-24" cy="-189" r="12" fill="#fff"/><circle cx="22" cy="-189" r="12" fill="#fff"/><circle cx="-30" cy="-189" r="6.5" fill="#2B211C"/><circle cx="16" cy="-189" r="6.5" fill="#2B211C"/><circle cx="-32" cy="-192" r="2" fill="#fff"/><circle cx="14" cy="-192" r="2" fill="#fff"/><path d="M-36-212q10-6 20 0M12-212q10-6 20 0" stroke="#3A2A22" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-10-173h18l-9 9z" fill="#E8707E" stroke="#E8707E" stroke-width="4" stroke-linejoin="round"/><path d="M-1-164v4"/><ellipse cx="-1" cy="-152" rx="9" ry="8" fill="#B5485A"/><path d="M-38-159l-26-4M-38-151l-24 4M36-159l26-4M36-151l24 4" stroke="#3A2A22" stroke-width="2.5" stroke-linecap="round" opacity=".7"/></g><g class="paw"><path d="M-18-93Q-60-101-88-125" stroke="#F59A45" stroke-width="28" fill="none" stroke-linecap="round"/><path d="M-54-109l6 14M-70-119l5 14" stroke="#3A2A22" stroke-width="6" stroke-linecap="round"/><circle cx="-94" cy="-129" r="17" fill="#FFE7C7"/></g></g><ellipse cx="620" cy="542" rx="36.0" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(620 540) scale(0.9 0.9)"><g class="bob"><ellipse cy="-14" rx="44" ry="16" fill="#8A5A3B"/><ellipse cy="-36" rx="32" ry="14" fill="#9C6B45"/><ellipse cy="-54" rx="20" ry="11" fill="#A87448"/><path d="M0-62q6-12 14-14" stroke="#A87448" stroke-width="8" fill="none" stroke-linecap="round"/><g transform="translate(0 -32) scale(1 1)"><path d="M-16 0q5-6 10 0M6 0q5-6 10 0" stroke="#3A2A22" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M-6 8q6 7 12 0" stroke="#3A2A22" stroke-width="3" fill="#E8707E" stroke-linecap="round"/><circle cx="-19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g></g><path d="M560 560q30-10 60 0" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/><g transform="translate(280 300) scale(1 1)"><g class="twinkle" style="animation-delay:0.0s"><path d="M0-12Q0 0 12 0Q0 0 0 12Q0 0-12 0Q0 0 0-12Z" fill="#E4573D"/></g></g>
</svg>
