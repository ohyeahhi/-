(1.1 1.1)"><path d="M-80 0V-170M80 0V-170M-90-170H90M-80-40H80" stroke="#9C6B45" stroke-width="10" stroke-linecap="round"/><path d="M-60 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M-50 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M-40 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M-30 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M-20 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M-10 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M0 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M10 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M20 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M30 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M40 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M50 -150V-40" stroke="#C9B6F2" stroke-width="2"/><path d="M60 -150V-40" stroke="#C9B6F2" stroke-width="2"/><rect x="-64" y="-110" width="128" height="40" fill="#B9A7E8" opacity=".9"/><path d="M-64-96h128M-64-84h128" stroke="#FFFFFF" stroke-width="2" opacity=".6"/></g><ellipse cx="500" cy="482" rx="0.0" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(500 480) scale(0.85 0.85)"><g class="breathe"><path d="M-72 0C-68-70-42-118 0-124S68-70 72 0Z" fill="#9C8FD9"/><path d="M-64-14C-40-6 40-6 64-14" stroke="#7F72C0" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-44-108C-40-150-22-166 0-166S40-150 44-108Z" fill="#FFF3DD"/><path d="M-14-164L0-138L14-164" stroke="#5B6BB5" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M2-136q14 8 8 30M2-136q-2 16-12 26" stroke="#D94A5E" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M-32-150Q-52-118-50-84" stroke="#FFF3DD" stroke-width="22" fill="none" stroke-linecap="round"/><path d="M32-150Q52-118 50-84" stroke="#FFF3DD" stroke-width="22" fill="none" stroke-linecap="round"/><circle cx="-50" cy="-76" r="10" fill="#FFD6B3"/><circle cx="50" cy="-76" r="10" fill="#FFD6B3"/><circle cx="0" cy="-168" r=