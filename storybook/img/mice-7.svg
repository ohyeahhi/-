<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<!-- 시골쥐와 서울쥐 7: 항아리 뒤에 숨은 쥐들 -->
<style>
.a{transform-box:fill-box}
.bob{animation:bob 2.6s ease-in-out infinite alternate;transform-box:fill-box}
.bob2{animation:bob 3.2s ease-in-out infinite alternate;animation-delay:-1.1s;transform-box:fill-box}
.breathe{animation:breathe 2.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.sway{animation:sway 4.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.drift{animation:drift 11s ease-in-out infinite alternate}
.drift2{animation:drift 14s ease-in-out infinite alternate-reverse}
.wag{animation:wag 1.7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}
.paw{animation:paw 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
.twinkle{animation:twinkle 1.9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.glow{animation:glow 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.float{animation:float 3.4s ease-in-out infinite alternate;transform-box:fill-box}
.rise{animation:rise 3.6s ease-out infinite;transform-box:fill-box}
.smoke{animation:smoke 4.5s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.hop{animation:hop .55s cubic-bezier(.3,0,.5,1) infinite alternate;transform-box:fill-box}
.chop{animation:chop .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:85% 90%}
.knock{animation:knock .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
.ear{animation:ear 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.ripple{animation:ripple 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.dangle{animation:dangle 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}
.flutter{animation:flutter 1.6s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes bob{to{transform:translateY(-5px)}}
@keyframes breathe{to{transform:scale(1.015,1.03)}}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes wag{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes paw{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
@keyframes twinkle{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes float{from{transform:translateY(4px)}to{transform:translateY(-8px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-50px) scale(1.4);opacity:0}}
@keyframes hop{to{transform:translateY(-14px)}}
@keyframes chop{from{transform:rotate(12deg)}to{transform:rotate(-22deg)}}
@keyframes knock{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes ear{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes dangle{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes flutter{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(14px,-12px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.shiver{animation:shiver .18s linear infinite alternate;transform-box:fill-box}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.fall{animation:fall 3.2s ease-in infinite;transform-box:fill-box}
.blow{animation:blow 1.4s ease-out infinite;transform-box:fill-box}
.snow{animation:snow 6s linear infinite;transform-box:fill-box}
.puff{animation:puff 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes shiver{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translateY(-10px) rotate(0)}100%{transform:translateY(30px) rotate(25deg)}}
@keyframes blow{0%{transform:translateX(-10px);opacity:0}30%{opacity:1}100%{transform:translateX(40px);opacity:0}}
@keyframes snow{0%{transform:translateY(-30px)}100%{transform:translateY(60px)}}
@keyframes puff{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D9B1"/><stop offset="1" stop-color="#E8C493"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".95"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient><radialGradient id="moonglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6D0" stop-opacity=".55"/><stop offset="1" stop-color="#FFF6D0" stop-opacity="0"/></radialGradient><radialGradient id="ropeglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/></radialGradient></defs>
<rect width="800" height="600" fill="url(#sky)"/><path d="M0 0h800v70H0z" fill="#9C6B45"/><path d="M0 70h800" stroke="#7A5232" stroke-width="8"/><path d="M120 0v70M400 0v70M680 0v70" stroke="#7A5232" stroke-width="10"/><rect y="470" width="800" height="130" fill="#A27A55"/><path d="M0 470h800" stroke="#8A6444" stroke-width="6"/><g transform="translate(330 540) scale(1.3 1.3)"><path d="M-40 0C-56-40-50-90-30-100H30C50-90 56-40 40 0Z" fill="#6B4A36"/><ellipse cy="-100" rx="32" ry="8" fill="#4E3526"/><ellipse cy="-100" rx="24" ry="5" fill="#6DB5DD"/><path d="M-30-60q30 10 60 0" stroke="#8A6448" stroke-width="5" fill="none"/></g><g transform="translate(410 540) scale(1.2 1.2)"><g class="shiver"><g class="bob"><path d="M30-10C60-10 60-30 70-34" stroke="#F2A6B4" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cy="-22" rx="32" ry="22" fill="#B8B4C2"/><circle cx="-14" cy="-56" r="13" fill="#B8B4C2"/><circle cx="14" cy="-56" r="13" fill="#B8B4C2"/><circle cx="-14" cy="-56" r="7" fill="#FFC4CF"/><circle cx="14" cy="-56" r="7" fill="#FFC4CF"/><circle cy="-36" r="20" fill="#B8B4C2"/><circle cy="-28" r="4" fill="#FF8FA3"/><g transform="translate(0 -40) scale(0.8 0.8)"><circle cx="-7" cy="0" r="3" fill="#3A2A22"/><circle cx="7" cy="0" r="3" fill="#3A2A22"/><circle cx="-15" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="15" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g></g></g><g transform="translate(440 470) scale(1 1)"><g class="fall"><path d="M0-22q12 14 0 22q-12-8 0-22z" fill="#9FD3F5" stroke="#7FB8E6" stroke-width="2"/><path d="M-3-10q-2 4 1 7" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/></g></g><g transform="translate(250 545) scale(-1.1 1.1)"><g class="bob"><path d="M30-10C60-10 60-30 70-34" stroke="#F2A6B4" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cy="-22" rx="32" ry="22" fill="#B8B4C2"/><circle cx="-14" cy="-56" r="13" fill="#B8B4C2"/><circle cx="14" cy="-56" r="13" fill="#B8B4C2"/><circle cx="-14" cy="-56" r="7" fill="#FFC4CF"/><circle cx="14" cy="-56" r="7" fill="#FFC4CF"/><circle cy="-36" r="20" fill="#B8B4C2"/><circle cy="-28" r="4" fill="#FF8FA3"/><g transform="translate(0 -40) scale(0.8 0.8)"><circle cx="-7" cy="1" r="2" fill="#3A2A22"/><circle cx="7" cy="1" r="2" fill="#3A2A22"/><path d="M-13 -6l10-4M13 -6l-10-4" stroke="#3A2A22" stroke-width="2.6" stroke-linecap="round"/><circle cx="-15" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="15" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g></g><ellipse cx="640" cy="522" rx="52.0" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(640 520) scale(1.3 1.3)"><g class="breathe"><g class="wag"><path d="M30-10q40 0 36-44" stroke="#F2C38B" stroke-width="12" fill="none" stroke-linecap="round"/></g><path d="M-34 0C-38-50-20-74 0-74S38-50 34 0Z" fill="#F2C38B"/><path d="M-14 0C-16-34-8-50 0-50S16-34 14 0Z" fill="#FFF1D6"/><path d="M-30-34q10 0 12 6M30-34q-10 0-12 6" stroke="#D99A55" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M-30-96L-26-130L-6-108ZM30-96L26-130L6-108Z" fill="#F2C38B"/><path d="M-25-104L-24-120L-14-110ZM25-104L24-120L14-110Z" fill="#FFC4CF"/><circle cy="-90" r="30" fill="#F2C38B"/><path d="M-8-118v10M0-120v10M8-118v10" stroke="#D99A55" stroke-width="4" stroke-linecap="round"/><g transform="translate(0 -90) scale(1 1)"><circle cx="-11" cy="-2" r="4" fill="#3A2A22"/><circle cx="11" cy="-2" r="4" fill="#3A2A22"/><path d="M-5 11q5 5 10 0" stroke="#3A2A22" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="-19" cy="8" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="19" cy="8" r="5.5" fill="#FF9AA8" opacity=".55"/><path d="M-3 4h6l-3 3z" fill="#FF8FA3" stroke="#FF8FA3" stroke-width="3" stroke-linejoin="round"/><path d="M-14 8l-16-2M-14 12l-16 4M14 8l16-2M14 12l16 4" stroke="#3A2A22" stroke-width="2" opacity=".6"/></g></g></g><g transform="translate(600 280) scale(1 1)"><g class="float"><text x="0" y="0" font-family="sans-serif" font-weight="800" font-size="44" fill="#5B6BB5">?</text></g></g>
</svg>
