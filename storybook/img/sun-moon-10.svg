<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<!-- 해님 달님 6: 해님이 된 누이, 달님이 된 오빠 -->
<style>
.a{transform-box:fill-box}
.bob{animation:bob 2.6s ease-in-out infinite alternate;transform-box:fill-box}
.bob2{animation:bob 3.2s ease-in-out infinite alternate;animation-delay:-1.1s;transform-box:fill-box}
.breathe{animation:breathe 2.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.sway{animation:sway 4.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.drift{animation:drift 11s ease-in-out infinite alternate}
.drift2{animation:drift 14s ease-in-out infinite alternate-reverse}
.wag{animation:wag 1.7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}
.paw{animation:paw 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
.twinkle{animation:twinkle 1.9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.glow{animation:glow 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.float{animation:float 3.4s ease-in-out infinite alternate;transform-box:fill-box}
.rise{animation:rise 3.6s ease-out infinite;transform-box:fill-box}
.smoke{animation:smoke 4.5s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.hop{animation:hop .55s cubic-bezier(.3,0,.5,1) infinite alternate;transform-box:fill-box}
.chop{animation:chop .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:85% 90%}
.knock{animation:knock .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
.ear{animation:ear 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.ripple{animation:ripple 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.dangle{animation:dangle 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}
.flutter{animation:flutter 1.6s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes bob{to{transform:translateY(-5px)}}
@keyframes breathe{to{transform:scale(1.015,1.03)}}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes wag{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes paw{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
@keyframes twinkle{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes float{from{transform:translateY(4px)}to{transform:translateY(-8px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-50px) scale(1.4);opacity:0}}
@keyframes hop{to{transform:translateY(-14px)}}
@keyframes chop{from{transform:rotate(12deg)}to{transform:rotate(-22deg)}}
@keyframes knock{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes ear{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes dangle{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes flutter{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(14px,-12px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.shiver{animation:shiver .18s linear infinite alternate;transform-box:fill-box}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.fall{animation:fall 3.2s ease-in infinite;transform-box:fill-box}
.blow{animation:blow 1.4s ease-out infinite;transform-box:fill-box}
.snow{animation:snow 6s linear infinite;transform-box:fill-box}
.puff{animation:puff 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes shiver{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translateY(-10px) rotate(0)}100%{transform:translateY(30px) rotate(25deg)}}
@keyframes blow{0%{transform:translateX(-10px);opacity:0}30%{opacity:1}100%{transform:translateX(40px);opacity:0}}
@keyframes snow{0%{transform:translateY(-30px)}100%{transform:translateY(60px)}}
@keyframes puff{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE6A0"/><stop offset="0.42" stop-color="#FFC98A"/><stop offset="0.58" stop-color="#3E4380"/><stop offset="1" stop-color="#1F2753"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".95"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient><radialGradient id="moonglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6D0" stop-opacity=".55"/><stop offset="1" stop-color="#FFF6D0" stop-opacity="0"/></radialGradient><radialGradient id="ropeglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/></radialGradient></defs>
<rect width="800" height="600" fill="url(#sky)"/><path d="M0 500C140 470 280 476 400 490S660 470 800 480V600H0Z" fill="#F6E2C4" opacity=".9"/><g transform="translate(560 80) scale(1 1)"><g class="twinkle" style="animation-delay:0.0s"><path d="M0-6L1.7999999999999998-1.7999999999999998L60L1.7999999999999998 1.7999999999999998L0 6L-1.7999999999999998 1.7999999999999998L-60L-1.7999999999999998-1.7999999999999998Z" fill="#FFF3C4"/></g></g><g transform="translate(700 150) scale(1 1)"><g class="twinkle" style="animation-delay:-0.6s"><path d="M0-7L2.1-2.1L70L2.1 2.1L0 7L-2.1 2.1L-70L-2.1-2.1Z" fill="#FFF3C4"/></g></g><g transform="translate(740 60) scale(1 1)"><g class="twinkle" style="animation-delay:-1.2s"><path d="M0-5L1.5-1.5L50L1.5 1.5L0 5L-1.5 1.5L-50L-1.5-1.5Z" fill="#FFF3C4"/></g></g><g transform="translate(620 220) scale(1 1)"><g class="twinkle" style="animation-delay:-1.7999999999999998s"><path d="M0-5L1.5-1.5L50L1.5 1.5L0 5L-1.5 1.5L-50L-1.5-1.5Z" fill="#FFF3C4"/></g></g><g transform="translate(220 270) scale(1 1)"><circle r="170" fill="url(#glow)"/><g class="glow"><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(0)"/><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(30)"/><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(60)"/><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(90)"/><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(120)"/><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(150)"/><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(180)"/><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(210)"/><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(240)"/><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(270)"/><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(300)"/><rect x="-6" y="-112" width="12" height="26" rx="6" fill="#FFC93C" transform="rotate(330)"/><circle r="78" fill="#FFD66B"/><path d="M-60-30C-62-80 62-80 60-30C50-50 30-58 0-56C-30-58-50-50-60-30Z" fill="#2E2A33"/><path d="M46-62q16 26 10 60" stroke="#2E2A33" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M54-8l12 14l-18-2z" fill="#D94A5E"/><g transform="translate(0 0) scale(1 1)"><path d="M-23 0q5-6 10 0M13 0q5-6 10 0" stroke="#3A2A22" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M-6 20q6 7 12 0" stroke="#3A2A22" stroke-width="3" fill="#E8707E" stroke-linecap="round"/><circle cx="-26" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="26" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g></g><g transform="translate(590 270) scale(1 1)"><circle r="150" fill="url(#moonglow)"/><g class="glow"><circle r="74" fill="#FFF1B8"/><circle cx="-26" cy="20" r="8" fill="#F2E3A0"/><circle cx="30" cy="-34" r="6" fill="#F2E3A0"/><path d="M-58-30C-60-76 60-76 58-30C46-48 24-54 0-52C-24-54-46-48-58-30Z" fill="#2E2A33"/><g transform="translate(0 0) scale(1 1)"><circle cx="-14" cy="0" r="4.5" fill="#3A2A22"/><circle cx="14" cy="0" r="4.5" fill="#3A2A22"/><path d="M-5 17q5 5 10 0" stroke="#3A2A22" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="-22" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="22" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g></g><g class="drift"><g transform="translate(60 440) scale(1.2 1.2)"><path d="M0 0a26 26 0 0 1 48-12a20 20 0 0 1 34 14a16 16 0 0 1 2 30H6a20 20 0 0 1-6-32z" fill="#FFF6E6" opacity=".9"/></g></g><g class="drift" style="animation-delay:-3s"><g transform="translate(620 450) scale(1.1 1.1)"><path d="M0 0a26 26 0 0 1 48-12a20 20 0 0 1 34 14a16 16 0 0 1 2 30H6a20 20 0 0 1-6-32z" fill="#C9CCE8" opacity=".9"/></g></g><g fill="#B98E62" opacity=".8"><path d="M260 520q40-40 80 0zM360 528q30-30 60 0zM470 522q36-36 72 0z"/></g>
</svg>
