<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<!-- 황금알을 낳는 닭 3: 기뻐하는 부부 -->
<style>
.a{transform-box:fill-box}
.bob{animation:bob 2.6s ease-in-out infinite alternate;transform-box:fill-box}
.bob2{animation:bob 3.2s ease-in-out infinite alternate;animation-delay:-1.1s;transform-box:fill-box}
.breathe{animation:breathe 2.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.sway{animation:sway 4.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.drift{animation:drift 11s ease-in-out infinite alternate}
.drift2{animation:drift 14s ease-in-out infinite alternate-reverse}
.wag{animation:wag 1.7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}
.paw{animation:paw 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
.twinkle{animation:twinkle 1.9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.glow{animation:glow 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.float{animation:float 3.4s ease-in-out infinite alternate;transform-box:fill-box}
.rise{animation:rise 3.6s ease-out infinite;transform-box:fill-box}
.smoke{animation:smoke 4.5s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.hop{animation:hop .55s cubic-bezier(.3,0,.5,1) infinite alternate;transform-box:fill-box}
.chop{animation:chop .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:85% 90%}
.knock{animation:knock .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
.ear{animation:ear 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.ripple{animation:ripple 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.dangle{animation:dangle 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}
.flutter{animation:flutter 1.6s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes bob{to{transform:translateY(-5px)}}
@keyframes breathe{to{transform:scale(1.015,1.03)}}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes wag{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes paw{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
@keyframes twinkle{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes float{from{transform:translateY(4px)}to{transform:translateY(-8px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-50px) scale(1.4);opacity:0}}
@keyframes hop{to{transform:translateY(-14px)}}
@keyframes chop{from{transform:rotate(12deg)}to{transform:rotate(-22deg)}}
@keyframes knock{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes ear{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes dangle{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes flutter{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(14px,-12px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.shiver{animation:shiver .18s linear infinite alternate;transform-box:fill-box}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.fall{animation:fall 3.2s ease-in infinite;transform-box:fill-box}
.blow{animation:blow 1.4s ease-out infinite;transform-box:fill-box}
.snow{animation:snow 6s linear infinite;transform-box:fill-box}
.puff{animation:puff 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes shiver{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translateY(-10px) rotate(0)}100%{transform:translateY(30px) rotate(25deg)}}
@keyframes blow{0%{transform:translateX(-10px);opacity:0}30%{opacity:1}100%{transform:translateX(40px);opacity:0}}
@keyframes snow{0%{transform:translateY(-30px)}100%{transform:translateY(60px)}}
@keyframes puff{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9CF"/><stop offset="1" stop-color="#F6D6B4"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".95"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient><radialGradient id="moonglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6D0" stop-opacity=".55"/><stop offset="1" stop-color="#FFF6D0" stop-opacity="0"/></radialGradient><radialGradient id="ropeglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/></radialGradient></defs>
<rect width="800" height="600" fill="url(#sky)"/><rect x="560" y="70" width="150" height="130" rx="10" fill="#BFE4FF" stroke="#B98E62" stroke-width="10"/><path d="M635 70v130M560 135h150" stroke="#B98E62" stroke-width="6"/><rect y="470" width="800" height="130" fill="#C99B6D"/><path d="M0 470h800" stroke="#B0845A" stroke-width="6"/><ellipse cx="280" cy="507" rx="51.0" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(280 505) scale(0.85 0.85)"><g class="breathe"><path d="M-34-2C-36-50-26-90 0-92S36-50 34-2Z" fill="#EFE6D2"/><path d="M0-80V-2" stroke="#D8CCB2" stroke-width="4"/><path d="M-36-22h28M8-22h28" stroke="#8A6E52" stroke-width="5" stroke-linecap="round"/><ellipse cx="-20" cy="-3" rx="16" ry="7" fill="#7A5A3E"/><ellipse cx="20" cy="-3" rx="16" ry="7" fill="#7A5A3E"/><path d="M-46-80C-46-138-26-160 0-160S46-138 46-80Z" fill="#7E8FB8"/><path d="M-12-158L0-132L12-158" stroke="#7A5A3E" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="-46" y="-92" width="92" height="12" rx="6" fill="#7A5A3E"/><circle cy="-192" r="32" fill="#FFD6B3"/><path d="M-30-180C-30-150 30-150 30-180C24-162 12-158 0-158S-24-162-30-180Z" fill="#3B3036"/><path d="M-32-196C-32-232 32-232 32-196C24-210 12-214 0-214S-24-210-32-196Z" fill="#3B3036"/><ellipse cy="-234" rx="10" ry="12" fill="#3B3036"/><rect x="-33" y="-212" width="66" height="9" rx="4.5" fill="#FFFFFF"/><g transform="translate(0 -194) scale(1 1)"><path d="M-11 -6l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#3A2A22"/><path d="M11 -6l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#3A2A22"/><path d="M-8 10q8 13 16 0z" fill="#E8707E" stroke="#3A2A22" stroke-width="2.5" stroke-linejoin="round"/><circle cx="-19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g><path d="M-30-146Q-60-176-56-214M30-146Q60-176 56-214" stroke="#7E8FB8" stroke-width="20" fill="none" stroke-linecap="round"/><circle cx="-56" cy="-220" r="10" fill="#FFD6B3"/><circle cx="56" cy="-220" r="10" fill="#FFD6B3"/><path d="M-16-178q8-8 16 0q8-8 16 0" stroke="#3B3036" stroke-width="5" fill="none" stroke-linecap="round"/></g><ellipse cx="500" cy="507" rx="51.0" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(500 505) scale(0.85 0.85)"><g class="breathe"><path d="M-72 0C-68-70-42-118 0-124S68-70 72 0Z" fill="#E4738A"/><path d="M-64-14C-40-6 40-6 64-14" stroke="#D05E77" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-44-108C-40-150-22-166 0-166S40-150 44-108Z" fill="#FFF3DD"/><path d="M-14-164L0-138L14-164" stroke="#5B6BB5" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M2-136q14 8 8 30M2-136q-2 16-12 26" stroke="#D94A5E" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M-32-150Q-52-118-50-84" stroke="#FFF3DD" stroke-width="22" fill="none" stroke-linecap="round"/><path d="M32-150Q52-118 50-84" stroke="#FFF3DD" stroke-width="22" fill="none" stroke-linecap="round"/><circle cx="-50" cy="-76" r="10" fill="#FFD6B3"/><circle cx="50" cy="-76" r="10" fill="#FFD6B3"/><circle cx="0" cy="-168" r="0"/><ellipse cx="0" cy="-230" rx="0" ry="0"/><circle cy="-196" r="31" fill="#FFD6B3"/><path d="M-31-196C-31-232 31-232 31-196C26-212 12-218 0-216C-12-218-25-212-31-196Z" fill="#2E2A33"/><path d="M0-226v11" stroke="#FFD6B3" stroke-width="2.5" stroke-linecap="round"/><g transform="translate(0 -196) scale(1 1)"><path d="M-11 -6l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#3A2A22"/><path d="M11 -6l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#3A2A22"/><path d="M-8 12q8 13 16 0z" fill="#E8707E" stroke="#3A2A22" stroke-width="2.5" stroke-linejoin="round"/><circle cx="-19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g><circle cx="30" cy="-212" r="12" fill="#2E2A33"/><path d="M18-214h30" stroke="#E9C46A" stroke-width="4" stroke-linecap="round"/></g></g><g transform="translate(390 380) scale(1.6 1.6)"><g class="glow"><ellipse cy="-20" rx="16" ry="20" fill="#FFD84A" stroke="#E8B830" stroke-width="2"/><ellipse cx="-6" cy="-28" rx="4" ry="2.5" fill="#FFFFFF" opacity=".45" transform="rotate(-30 -6 -28)"/></g><g transform="translate(-26 -40) scale(1 1)"><g class="twinkle" style="animation-delay:0.0s"><path d="M0-7Q0 0 7 0Q0 0 0 7Q0 0-7 0Q0 0 0-7Z" fill="#FFE27A"/></g></g><g transform="translate(24 -48) scale(1 1)"><g class="twinkle" style="animation-delay:-0.5s"><path d="M0-6Q0 0 6 0Q0 0 0 6Q0 0-6 0Q0 0 0-6Z" fill="#FFE27A"/></g></g></g><g transform="translate(330 280) scale(1 1)"><g class="twinkle" style="animation-delay:0.0s"><path d="M0-12Q0 0 12 0Q0 0 0 12Q0 0-12 0Q0 0 0-12Z" fill="#FFD84A"/></g></g><g transform="translate(450 300) scale(1 1)"><g class="twinkle" style="animation-delay:-0.5s"><path d="M0-10Q0 0 10 0Q0 0 0 10Q0 0-10 0Q0 0 0-10Z" fill="#FFD84A"/></g></g><g transform="translate(390 240) scale(1 1)"><g class="twinkle" style="animation-delay:-1.0s"><path d="M0-8Q0 0 8 0Q0 0 0 8Q0 0-8 0Q0 0 0-8Z" fill="#FFD84A"/></g></g>
</svg>
