ll="#7A5A3E"/><path d="M-46-80C-46-138-26-160 0-160S46-138 46-80Z" fill="#A8784E"/><path d="M-12-158L0-132L12-158" stroke="#7A5A3E" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="-46" y="-92" width="92" height="12" rx="6" fill="#7A5A3E"/><circle cy="-192" r="32" fill="#FFD6B3"/><path d="M-30-180C-30-150 30-150 30-180C24-162 12-158 0-158S-24-162-30-180Z" fill="#3B3036"/><path d="M-32-196C-32-232 32-232 32-196C24-210 12-214 0-214S-24-210-32-196Z" fill="#3B3036"/><ellipse cy="-234" rx="10" ry="12" fill="#3B3036"/><rect x="-33" y="-212" width="66" height="9" rx="4.5" fill="#FFFFFF"/><g transform="translate(0 -194) scale(1 1)"><circle cx="-11" cy="0" r="4.5" fill="#3A2A22"/><circle cx="11" cy="0" r="4.5" fill="#3A2A22"/><ellipse cy="14" rx="4.5" ry="5.5" fill="#B5485A"/><circle cx="-19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g><path d="M30-146Q70-150 96-130" stroke="#A8784E" stroke-width="20" fill="none" stroke-linecap="round"/><circle cx="102" cy="-126" r="10" fill="#FFD6B3"/><path d="M-30-146Q-50-120-46-96" stroke="#A8784E" stroke-width="20" fill="none" stroke-linecap="round"/><circle cx="-46" cy="-90" r="10" fill="#FFD6B3"/></g><g transform="translate(230 270) scale(1 1)"><g class="twinkle" style="animation-delay:0.0s"><path d="M0-12Q0 0 12 0Q0 0 0 12Q0 0-12 0Q0 0 0-12Z" fill="#E4573D"/></g></g>
</svg>
