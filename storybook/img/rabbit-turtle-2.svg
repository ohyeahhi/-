<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<!-- 토끼와 거북이 2: 거북이를 놀리는 토끼 -->
<style>
.a{transform-box:fill-box}
.bob{animation:bob 2.6s ease-in-out infinite alternate;transform-box:fill-box}
.bob2{animation:bob 3.2s ease-in-out infinite alternate;animation-delay:-1.1s;transform-box:fill-box}
.breathe{animation:breathe 2.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.sway{animation:sway 4.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.drift{animation:drift 11s ease-in-out infinite alternate}
.drift2{animation:drift 14s ease-in-out infinite alternate-reverse}
.wag{animation:wag 1.7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}
.paw{animation:paw 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
.twinkle{animation:twinkle 1.9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.glow{animation:glow 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.float{animation:float 3.4s ease-in-out infinite alternate;transform-box:fill-box}
.rise{animation:rise 3.6s ease-out infinite;transform-box:fill-box}
.smoke{animation:smoke 4.5s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.hop{animation:hop .55s cubic-bezier(.3,0,.5,1) infinite alternate;transform-box:fill-box}
.chop{animation:chop .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:85% 90%}
.knock{animation:knock .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
.ear{animation:ear 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.ripple{animation:ripple 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.dangle{animation:dangle 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}
.flutter{animation:flutter 1.6s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes bob{to{transform:translateY(-5px)}}
@keyframes breathe{to{transform:scale(1.015,1.03)}}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes wag{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes paw{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
@keyframes twinkle{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes float{from{transform:translateY(4px)}to{transform:translateY(-8px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-50px) scale(1.4);opacity:0}}
@keyframes hop{to{transform:translateY(-14px)}}
@keyframes chop{from{transform:rotate(12deg)}to{transform:rotate(-22deg)}}
@keyframes knock{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes ear{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes dangle{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes flutter{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(14px,-12px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9EAFF"/><stop offset="0.7" stop-color="#FFF8DC"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".95"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient><radialGradient id="moonglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6D0" stop-opacity=".55"/><stop offset="1" stop-color="#FFF6D0" stop-opacity="0"/></radialGradient><radialGradient id="ropeglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/></radialGradient></defs>
<rect width="800" height="600" fill="url(#sky)"/><path d="M0 380C120 330 220 318 330 350S540 320 660 334 770 352 800 356V600H0Z" fill="#BFE0B5"/><path d="M0 448C150 420 300 424 420 440S680 434 800 426V600H0Z" fill="#A8D57F"/><g transform="translate(670 100) scale(1 1)"><circle r="96.0" fill="url(#glow)"/><g class="glow"><circle r="40" fill="#FFD66B"/><circle r="33.6" fill="#FFE08A"/></g></g><g class="drift"><g transform="translate(120 90) scale(1 1)"><path d="M0 0a26 26 0 0 1 48-12a20 20 0 0 1 34 14a16 16 0 0 1 2 30H6a20 20 0 0 1-6-32z" fill="#FFF6E6" opacity=".9"/></g></g><ellipse cx="270" cy="528" rx="64" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(270 524) scale(1.35 1.35)"><g class="ear"><ellipse cx="-13" cy="-150" rx="10" ry="32" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><ellipse cx="-13" cy="-148" rx="5" ry="22" fill="#FFC4CF"/></g><g class="ear" style="animation-delay:-1s"><ellipse cx="13" cy="-150" rx="10" ry="32" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><ellipse cx="13" cy="-148" rx="5" ry="22" fill="#FFC4CF"/></g><ellipse cx="0" cy="-40" rx="32" ry="38" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><ellipse cx="0" cy="-34" rx="18" ry="24" fill="#FFFFFF"/><circle cx="30" cy="-24" r="11" fill="#FFFFFF" stroke="#EDE6DA" stroke-width="2"/><ellipse cx="-15" cy="-4" rx="15" ry="7" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><ellipse cx="15" cy="-4" rx="15" ry="7" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><path d="M20-56Q44-62 60-76" stroke="#FBF8F3" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="62" cy="-78" r="7" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><path d="M-20-56q-10 10-4 20" stroke="#FBF8F3" stroke-width="12" fill="none" stroke-linecap="round"/><circle cy="-98" r="30" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><g transform="translate(0 -98) scale(1 1)"><path d="M-16 -4h10M6 -4h10" stroke="#3A2A22" stroke-width="3.2" stroke-linecap="round"/><circle cx="-11" cy="-1" r="3" fill="#3A2A22"/><circle cx="11" cy="-1" r="3" fill="#3A2A22"/><path d="M-8 9q8 10 16 0z" fill="#E8707E" stroke="#3A2A22" stroke-width="2.5" stroke-linejoin="round"/><circle cx="-19" cy="6" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="19" cy="6" r="5.5" fill="#FF9AA8" opacity=".55"/><path d="M-4 3h8l-4 4z" fill="#FF8FA3" stroke="#FF8FA3" stroke-width="3" stroke-linejoin="round"/></g></g><ellipse cx="560" cy="528" rx="96" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(550 524) scale(-1.4 1.4)"><g class="bob"><ellipse cx="-34" cy="-4" rx="13" ry="9" fill="#A8D58A"/><ellipse cx="30" cy="-4" rx="13" ry="9" fill="#A8D58A"/><path d="M-58-14l-12 6l12 2z" fill="#A8D58A"/><path d="M50-30Q66-40 70-56" stroke="#A8D58A" stroke-width="20" fill="none" stroke-linecap="round"/><circle cx="76" cy="-62" r="22" fill="#A8D58A"/><g transform="translate(80 -62) scale(1 1)"><circle cx="-7" cy="-2" r="3.6" fill="#3A2A22"/><circle cx="7" cy="-2" r="3.6" fill="#3A2A22"/><path d="M-13 -11l10 3M13 -11l-10 3" stroke="#3A2A22" stroke-width="3" stroke-linecap="round"/><path d="M-5 9h10" stroke="#3A2A22" stroke-width="3" stroke-linecap="round"/><circle cx="-15" cy="8" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="15" cy="8" r="5.5" fill="#FF9AA8" opacity=".55"/></g><path d="M-58-12C-58-76 58-76 58-12Z" fill="#7DB86A"/><path d="M-30-60l-8 22h20l8-22M30-60l8 22H18l-8-22M-38-38l-14 22M38-38l14 22M-18-38L-10-16h20l8-22" stroke="#5E9A50" stroke-width="4" fill="none" stroke-linejoin="round"/><rect x="-62" y="-18" width="124" height="12" rx="6" fill="#E9D9A0"/></g></g><g transform="translate(600 340) scale(1 1)"><g class="twinkle" style="animation-delay:0.0s"><path d="M0-12Q0 0 12 0Q0 0 0 12Q0 0-12 0Q0 0 0-12Z" fill="#FF9AA8"/></g></g><g transform="translate(150 540) scale(1 1)"><circle cx="0" cy="-6" r="5" fill="#FFF6E6"/><circle cx="6" cy="0" r="5" fill="#FFF6E6"/><circle cx="0" cy="6" r="5" fill="#FFF6E6"/><circle cx="-6" cy="0" r="5" fill="#FFF6E6"/><circle r="4" fill="#FFC93C"/></g><g transform="translate(700 548) scale(1 1)"><circle cx="0" cy="-6" r="5" fill="#FFC4CF"/><circle cx="6" cy="0" r="5" fill="#FFC4CF"/><circle cx="0" cy="6" r="5" fill="#FFC4CF"/><circle cx="-6" cy="0" r="5" fill="#FFC4CF"/><circle r="4" fill="#FFC93C"/></g><g transform="translate(420 560) scale(1 1)"><path d="M-14 0Q-12-16-4-22M0 0Q0-20 4-28M12 0Q12-14 18-20" stroke="#7FA552" stroke-width="5" stroke-linecap="round" fill="none"/></g><g transform="translate(80 556) scale(1 1)"><path d="M-14 0Q-12-16-4-22M0 0Q0-20 4-28M12 0Q12-14 18-20" stroke="#7FA552" stroke-width="5" stroke-linecap="round" fill="none"/></g>
</svg>
