llipse cy="-52" rx="6" ry="14" fill="#8A5A3B"/></g><g transform="translate(696 512) scale(1 1)"><path d="M0 0V-46" stroke="#5E9A50" stroke-width="5" stroke-linecap="round"/><ellipse cy="-52" rx="6" ry="14" fill="#8A5A3B"/></g><g transform="translate(520 440) scale(1 1)"><g class="twinkle" style="animation-delay:0.0s"><path d="M0-10Q0 0 10 0Q0 0 0 10Q0 0-10 0Q0 0 0-10Z" fill="#FFFFFF"/></g></g><g transform="translate(610 430) scale(1 1)"><g class="twinkle" style="animation-delay:-0.5s"><path d="M0-8Q0 0 8 0Q0 0 0 8Q0 0-8 0Q0 0 0-8Z" fill="#FFFFFF"/></g></g><g transform="translate(470 250) scale(1.2 1.2)"><g class="flutter"><path d="M-6 0C-40-26-50-6-42 4C-28 0-14 4-6 6Z" fill="#5FA8E0"/><ellipse rx="20" ry="14" fill="#7FC0F0"/><circle cx="16" cy="-6" r="11" fill="#7FC0F0"/><circle cx="19" cy="-8" r="2.5" fill="#2B211C"/><path d="M26-6l10 3-10 3z" fill="#FFC93C"/><path d="M-18 4l-14 6" stroke="#5FA8E0" stroke-width="6" stroke-linecap="round"/></g></g><ellipse cx="230" cy="517" rx="57.0" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(230 515) scale(0.95 0.95)"><g class="breathe"><path d="M-34-2C-36-50-26-90 0-92S36-50 34-2Z" fill="#EFE6D2"/><path d="M0-80V-2" stroke="#D8CCB2" stroke-width="4"/><path d="M-36-22h28M8-22h28" stroke="#8A6E52" stroke-width="5" stroke-linecap="round"/><ellipse cx="-20" cy="-3" rx="16" ry="7" fill="#7A5A3E"/><ellipse cx="20" cy="-3" rx="16" ry="7" fill="#7A5A3E"/><path d="M-46-80C-46-138-26-160 0-160S46-138 46-80Z" fill="#7E9CC0"/><path d="M-12-158L0-132L12-158" stroke="#7A5A3E" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="-46" y="-92" width="92" height="12" rx="6" fill="#7A5A3E"/><circle cy="-192" r="32" fill="#FFD6B3"/><path d="M-30-180C-30-150 30-150 30-180C24-162 12-158 0-158S-24-162-30-180Z" fill="#DCDAE2"/><path d="M-32-196C-32-232 32-232 32-196C24-210 12-214 0-214S-24-210-32-196Z" fill="#DCDAE2"/><ellipse cy="-234" rx="10" ry="12" fill="#DCDAE2"/><rect x="-33" y="-212" width="66" height="9" rx="4.5" fil