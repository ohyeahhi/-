2" fill="#DCDAE2"/><rect x="-33" y="-212" width="66" height="9" rx="4.5" fill="#FFFFFF"/><g transform="translate(0 -194) scale(1 1)"><path d="M-16 -2l10 3M16 -2l-10 3" stroke="#3A2A22" stroke-width="3" stroke-linecap="round"/><path d="M-7 15q3.5-4 7 0t7 0" stroke="#3A2A22" stroke-width="2.8" fill="none" stroke-linecap="round"/><circle cx="-19" cy="10" r="5.5" fill="#B7D8A8" opacity=".6"/><circle cx="19" cy="10" r="5.5" fill="#B7D8A8" opacity=".6"/></g></g><path d="M-30-146Q-50-120-46-96M30-146Q50-120 46-96" stroke="#7E9CC0" stroke-width="20" fill="none" stroke-linecap="round"/><circle cx="-46" cy="-90" r="10" fill="#FFD6B3"/><circle cx="46" cy="-90" r="10" fill="#FFD6B3"/><g transform="translate(0 -214) scale(0.9 0.9)"><path d="M-30 0L-34-34L-16-16L0-40L16-16L34-34L30 0Z" fill="#FFD84A" stroke="#E0A419" stroke-width="3"/><circle cy="-10" r="5" fill="#E4573D"/></g></g></g><path d="M-70-108C-30-136 120-126 140-92V-40H-70Z" fill="#E4738A"/><path d="M-60-100c40-14 120-14 190 4" stroke="#FFFFFF" stroke-width="5" fill="none" opacity=".6"/><rect x="-150" y="-60" width="300" height="40" rx="10" fill="#B98E62"/><rect x="128" y="-96" width="22" height="96" rx="6" fill="#9C6B45"/><rect x="-150" y="-30" width="22" height="30" rx="6" fill="#9C6B45"/></g><g transform="translate(352 418) scale(1 1)"><g transform="rotate(-25)"><rect x="-22" y="-8" width="44" height="16" rx="8" fill="#F2C38B"/><rect x="-8" y="-8" width="16" height="16" fill="#E0A85E"/></g><g class="rise"><path d="M30-30q6-8 0-16q-6-8 0-16" stroke="#F08A7A" stroke-width="3" fill="none"/></g></g><g transform="translate(200 300) scale(1 1)"><g class="float" style="animation-delay:0.0s"><circle cx="-80" cy="-20" r="18" fill="#DFF3FF" fill-opacity=".5" stroke="#B9D7F2" stroke-width="2"/><circle cx="-86.3" cy="-26.3" r="3.6" fill="#FFFFFF"/></g><g class="float" style="animation-delay:-0.5s"><circle cx="-20" cy="-60" r="24" fill="#DFF3FF" fill-opacity=".5" stroke="#B9D7F2" stroke-width="2"/><circle cx="-28.4" cy="-68.4" r="4.8" fill="#FFFFFF"/></g><g class="float" style="animation-delay:-1.0s"><circle cx="50" cy="-10" r="14" fill="#DFF3FF" fill-opacity=".5" stroke="#B9D7F2" stroke-width="2"/><circle cx="45.1" cy="-14.9" r="2.8" fill="#FFFFFF"/></g><g class="float" style="animation-delay:-1.5s"><circle cx="90" cy="-70" r="20" fill="#DFF3FF" fill-opacity=".5" stroke="#B9D7F2" stroke-width="2"/><circle cx="83.0" cy="-77.0" r="4.0" fill="#FFFFFF"/></g><g class="float" style="animation-delay:-2.0s"><circle cx="10" cy="20" r="12" fill="#DFF3FF" fill-opacity=".5" stroke="#B9D7F2" stroke-width="2"/><circle cx="5.8" cy="15.8" r="2.4" fill="#FFFFFF"/></g></g><g transform="translate(140 460) scale(0.9 0.9)"><g class="bob"><path d="M-30 0C-18-18 18-18 30 0C18 18-18 18-30 0Z" fill="#7FB8E6"/><path d="M28 0l20-14v28z" fill="#7FB8E6"/><circle cx="-16" cy="-3" r="4" fill="#FFFFFF"/><circle cx="-16" cy="-3" r="2" fill="#3A2A22"/><path d="M-4-10q6 10 0 20M6-10q6 10 0 20" stroke="#FFFFFF" stroke-width="3" fill="none" opacity=".6"/></g></g><g transform="translate(700 420) scale(0.8 0.8)"><g class="bob"><path d="M-30 0C-18-18 18-18 30 0C18 18-18 18-30 0Z" fill="#F2A33C"/><path d="M28 0l20-14v28z" fill="#F2A33C"/><circle cx="-16" cy="-3" r="4" fill="#FFFFFF"/><circle cx="-16" cy="-3" r="2" fill="#3A2A22"/><path d="M-4-10q6 10 0 20M6-10q6 10 0 20" stroke="#FFFFFF" stroke-width="3" fill="none" opacity=".6"/></g></g>
</svg>
