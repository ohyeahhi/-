width="3" fill="none" stroke-linecap="round" transform="rotate(180 0 1)"/><g class="rise"><path d="M-8 6q4 7 0 11q-4-4 0-11z" fill="#8FD0F2"/></g><path d="M-6 14q6-7 12 0" stroke="#3A2A22" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="-16" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="16" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g></g><g transform="translate(620 500) scale(0.6 0.6)"><g class="shiver"><rect x="-26" y="-26" width="9" height="26" rx="4" fill="#3A3436"/><rect x="-6" y="-26" width="9" height="26" rx="4" fill="#3A3436"/><rect x="14" y="-26" width="9" height="26" rx="4" fill="#3A3436"/><rect x="30" y="-26" width="9" height="26" rx="4" fill="#3A3436"/><circle cx="-30" cy="-50" r="24" fill="#FFFFFF" stroke="#E5E2DA" stroke-width="2"/><circle cx="-6" cy="-60" r="26" fill="#FFFFFF" stroke="#E5E2DA" stroke-width="2"/><circle cx="20" cy="-54" r="24" fill="#FFFFFF" stroke="#E5E2DA" stroke-width="2"/><circle cx="-20" cy="-32" r="22" fill="#FFFFFF" stroke="#E5E2DA" stroke-width="2"/><circle cx="8" cy="-32" r="24" fill="#FFFFFF" stroke="#E5E2DA" stroke-width="2"/><circle cx="28" cy="-36" r="20" fill="#FFFFFF" stroke="#E5E2DA" stroke-width="2"/><ellipse cx="52" cy="-62" rx="20" ry="24" fill="#3A3436"/><ellipse cx="34" cy="-70" rx="12" ry="6" fill="#3A3436" transform="rotate(-20 34 -70)"/><circle cx="50" cy="-82" r="12" fill="#FFFFFF"/><g transform="translate(52 -62) scale(1 1)"><circle cx="-6" r="3.6" fill="#fff"/><circle cx="8" r="3.6" fill="#fff"/><ellipse cx="1" cy="14" rx="4" ry="5" fill="#E8707E"/></g></g></g><g transform="translate(740 510) scale(0.55 0.55)"><g class="shiver"><rect x="-26" y="-26" width="9" height="26" rx="4" fill="#3A3436"/><rect x="-6" y="-26" width="9" height="26" rx="4" fill="#3A3436"/><rect x="14" y="-26" width="9" height="26" rx="4" fill="#3A3436"/><rect x="30" y="-26" width="9" height="26" rx="4" fill="#3A3436"/><circle cx="-30" cy="-50" r="24" fill="#FFFFFF" stroke="#E5E2DA" stroke-width="2"/><c