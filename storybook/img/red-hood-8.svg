-46-12q8 7 15 0t15 0 15 0 15 0 15 0 15 0" stroke="#F2D4DC" stroke-width="5" fill="none"/></g></g><path d="M-70-108C-30-136 120-126 140-92V-40H-70Z" fill="#E4738A"/><path d="M-60-100c40-14 120-14 190 4" stroke="#FFFFFF" stroke-width="5" fill="none" opacity=".6"/><rect x="-150" y="-60" width="300" height="40" rx="10" fill="#B98E62"/><rect x="128" y="-96" width="22" height="96" rx="6" fill="#9C6B45"/><rect x="-150" y="-30" width="22" height="30" rx="6" fill="#9C6B45"/></g><g class="rise" style="animation-delay:0s"><text x="520" y="260" font-family="sans-serif" font-weight="700" font-size="30" fill="#5B6BB5">z</text></g><g class="rise" style="animation-delay:-1.2s"><text x="540" y="240" font-family="sans-serif" font-weight="700" font-size="24" fill="#5B6BB5">z</text></g><g class="rise" style="animation-delay:-2.4s"><text x="556" y="222" font-family="sans-serif" font-weight="700" font-size="18" fill="#5B6BB5">z</text></g><ellipse cx="200" cy="507" rx="57.0" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(200 505) scale(0.95 0.95)"><g class="breathe"><path d="M-34-2C-36-50-26-90 0-92S36-50 34-2Z" fill="#EFE6D2"/><path d="M0-80V-2" stroke="#D8CCB2" stroke-width="4"/><path d="M-36-22h28M8-22h28" stroke="#8A6E52" stroke-width="5" stroke-linecap="round"/><ellipse cx="-20" cy="-3" rx="16" ry="7" fill="#7A5A3E"/><ellipse cx="20" cy="-3" rx="16" ry="7" fill="#7A5A3E"/><path d="M-46-80C-46-138-26-160 0-160S46-138 46-80Z" fill="#6E9A5C"/><path d="M-12-158L0-132L12-158" stroke="#7A5A3E" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="-46" y="-92" width="92" height="12" rx="6" fill="#7A5A3E"/><circle cy="-192" r="32" fill="#FFD6B3"/><path d="M-30-180C-30-150 30-150 30-180C24-162 12-158 0-158S-24-162-30-180Z" fill="#3B3036"/><path d="M-32-196C-32-232 32-232 32-196C24-210 12-214 0-214S-24-210-32-196Z" fill="#3B3036"/><ellipse cy="-234" rx="10" ry="12" fill="#3B3036"/><rect x="-33" y="-212" width="66" height="9" rx="4.5" fill="#FFFFFF"/><g transform="translate(0 -194) scale(1 1)"><circle cx="-11" cy="0" r="4.5" fill="#3A2A22"/><circle cx="11" cy="0" r="4.5" fill="#3A2A22"/><ellipse cy="14" rx="4.5" ry="5.5" fill="#B5485A"/><circle cx="-19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g><path d="M-30-146Q-50-120-46-96M30-146Q50-120 46-96" stroke="#6E9A5C" stroke-width="20" fill="none" stroke-linecap="round"/><circle cx="-46" cy="-90" r="10" fill="#FFD6B3"/><circle cx="46" cy="-90" r="10" fill="#FFD6B3"/><ellipse cy="-222" rx="44" ry="9" fill="#5A7A4A"/><path d="M-26-222q0-28 26-28t26 28z" fill="#5A7A4A"/><path d="M18-246l18-16" stroke="#E4573D" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(260 220) scale(1 1)"><g class="float"><text x="0" y="0" font-family="sans-serif" font-weight="800" font-size="44" fill="#5B6BB5">?</text></g></g>
</svg>
