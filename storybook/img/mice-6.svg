"/><circle cy="-36" r="20" fill="#B8B4C2"/><circle cy="-28" r="4" fill="#FF8FA3"/><g transform="translate(0 -40) scale(0.8 0.8)"><circle cx="-7" cy="0" r="3" fill="#3A2A22"/><circle cx="7" cy="0" r="3" fill="#3A2A22"/><circle cx="-15" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="15" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g></g><ellipse cx="350" cy="468" rx="26.400000000000002" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(350 466) scale(-1.1 1.1)"><g class="bob"><path d="M30-10C60-10 60-30 70-34" stroke="#F2A6B4" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cy="-22" rx="32" ry="22" fill="#C9A27E"/><circle cx="-14" cy="-56" r="13" fill="#C9A27E"/><circle cx="14" cy="-56" r="13" fill="#C9A27E"/><circle cx="-14" cy="-56" r="7" fill="#FFC4CF"/><circle cx="14" cy="-56" r="7" fill="#FFC4CF"/><circle cy="-36" r="20" fill="#C9A27E"/><circle cy="-28" r="4" fill="#FF8FA3"/><g transform="translate(0 -40) scale(0.8 0.8)"><circle cx="-7" cy="0" r="3" fill="#3A2A22"/><circle cx="7" cy="0" r="3" fill="#3A2A22"/><circle cx="-15" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="15" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g><path d="M-10-14l10 5 10-5v10l-10-5-10 5z" fill="#E4573D"/></g><ellipse cx="620" cy="517" rx="80.0" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(620 515) scale(1.6 1.6)"><g class="breathe"><g class="wag"><path d="M30-10q40 0 36-44" stroke="#F2C38B" stroke-width="12" fill="none" stroke-linecap="round"/></g><path d="M-34 0C-38-50-20-74 0-74S38-50 34 0Z" fill="#F2C38B"/><path d="M-14 0C-16-34-8-50 0-50S16-34 14 0Z" fill="#FFF1D6"/><path d="M-30-34q10 0 12 6M30-34q-10 0-12 6" stroke="#D99A55" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M-30-96L-26-130L-6-108ZM30-96L26-130L6-108Z" fill="#F2C38B"/><path d="M-25-104L-24-120L-14-110ZM25-104L24-120L14-110Z" fill="#FFC4CF"/><circle cy="-90" r="30" fill="#F2C38B"/><path d="M-8-118v10M0-120v10M8-118v10" stroke=