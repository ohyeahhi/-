<g class="ear"><ellipse cx="-13" cy="-150" rx="10" ry="32" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><ellipse cx="-13" cy="-148" rx="5" ry="22" fill="#FFC4CF"/></g><g class="ear" style="animation-delay:-1s"><ellipse cx="13" cy="-150" rx="10" ry="32" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><ellipse cx="13" cy="-148" rx="5" ry="22" fill="#FFC4CF"/></g><ellipse cx="0" cy="-40" rx="32" ry="38" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><ellipse cx="0" cy="-34" rx="18" ry="24" fill="#FFFFFF"/><circle cx="30" cy="-24" r="11" fill="#FFFFFF" stroke="#EDE6DA" stroke-width="2"/><ellipse cx="-15" cy="-4" rx="15" ry="7" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><ellipse cx="15" cy="-4" rx="15" ry="7" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><path d="M-20-56q-10 10-4 20M20-56q10 10 4 20" stroke="#FBF8F3" stroke-width="12" fill="none" stroke-linecap="round"/><circle cy="-98" r="30" fill="#FBF8F3" stroke="#EDE6DA" stroke-width="2"/><g transform="translate(0 -98) scale(1 1)"><path d="M-16 -4q5-6 10 0M6 -4q5-6 10 0" stroke="#3A2A22" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M-6 10q6 7 12 0" stroke="#3A2A22" stroke-width="3" fill="#E8707E" stroke-linecap="round"/><circle cx="-19" cy="6" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="19" cy="6" r="5.5" fill="#FF9AA8" opacity=".55"/><path d="M-4 3h8l-4 4z" fill="#FF8FA3" stroke="#FF8FA3" stroke-width="3" stroke-linejoin="round"/></g></g><ellipse cx="500" cy="528" rx="96" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(490 524) scale(1.4 1.4)"><g class="bob"><ellipse cx="-34" cy="-4" rx="13" ry="9" fill="#A8D58A"/><ellipse cx="30" cy="-4" rx="13" ry="9" fill="#A8D58A"/><path d="M-58-14l-12 6l12 2z" fill="#A8D58A"/><path d="M50-30Q66-40 70-56" stroke="#A8D58A" stroke-width="20" fill="none" stroke-linecap="round"/><circle cx="76" cy="-62" r="22" fill="#A8D58A"/><g transform="translate(80 -62) scale(1 1)"><path d="M-12 -2q5-6 10 0M2 -2q5-6 10 0" stroke="#3A2A