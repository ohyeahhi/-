g></g><path d="M40-80q26 10 30 34" stroke="#F08A7A" stroke-width="16" fill="none" stroke-linecap="round"/></g><g transform="translate(660 520) scale(0.6 0.6)"><ellipse cx="-60" cy="-6" rx="16" ry="6" fill="#FFC93C" stroke="#E0A419" stroke-width="2"/><ellipse cx="-60" cy="-14" rx="16" ry="6" fill="#FFC93C" stroke="#E0A419" stroke-width="2"/><ellipse cx="-60" cy="-22" rx="16" ry="6" fill="#FFC93C" stroke="#E0A419" stroke-width="2"/><ellipse cx="-36" cy="-6" rx="16" ry="6" fill="#FFC93C" stroke="#E0A419" stroke-width="2"/><ellipse cx="-36" cy="-14" rx="16" ry="6" fill="#FFC93C" stroke="#E0A419" stroke-width="2"/><ellipse cx="60" cy="-6" rx="16" ry="6" fill="#FFC93C" stroke="#E0A419" stroke-width="2"/><ellipse cx="60" cy="-14" rx="16" ry="6" fill="#FFC93C" stroke="#E0A419" stroke-width="2"/><ellipse cx="40" cy="-6" rx="16" ry="6" fill="#FFC93C" stroke="#E0A419" stroke-width="2"/><path d="M-20 0C-36-20-30-56-10-62L-16-74h32l-6 12C30-56 36-20 20 0Z" fill="#E9D9B0"/><path d="M-14-66h28" stroke="#B07440" stroke-width="5"/><rect x="70" y="-46" width="22" height="44" rx="6" fill="#E4738A"/><rect x="96" y="-40" width="22" height="38" rx="6" fill="#7FB8E6"/><g transform="translate(-40 -60) scale(1 1)"><g class="twinkle" style="animation-delay:0.0s"><path d="M0-12Q0 0 12 0Q0 0 0 12Q0 0-12 0Q0 0 0-12Z" fill="#FFE27A"/></g></g><g transform="translate(50 -50) scale(1 1)"><g class="twinkle" style="animation-delay:-0.5s"><path d="M0-10Q0 0 10 0Q0 0 0 10Q0 0-10 0Q0 0 0-10Z" fill="#FFE27A"/></g></g><g transform="translate(10 -90) scale(1 1)"><g class="twinkle" style="animation-delay:-1.0s"><path d="M0-9Q0 0 9 0Q0 0 0 9Q0 0-9 0Q0 0 0-9Z" fill="#FFE27A"/></g></g></g>
</svg>
