<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<!-- 해님과 바람 4: 후우우! 힘껏 부는 바람 -->
<style>
.a{transform-box:fill-box}
.bob{animation:bob 2.6s ease-in-out infinite alternate;transform-box:fill-box}
.bob2{animation:bob 3.2s ease-in-out infinite alternate;animation-delay:-1.1s;transform-box:fill-box}
.breathe{animation:breathe 2.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.sway{animation:sway 4.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.drift{animation:drift 11s ease-in-out infinite alternate}
.drift2{animation:drift 14s ease-in-out infinite alternate-reverse}
.wag{animation:wag 1.7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}
.paw{animation:paw 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
.twinkle{animation:twinkle 1.9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.glow{animation:glow 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.float{animation:float 3.4s ease-in-out infinite alternate;transform-box:fill-box}
.rise{animation:rise 3.6s ease-out infinite;transform-box:fill-box}
.smoke{animation:smoke 4.5s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.hop{animation:hop .55s cubic-bezier(.3,0,.5,1) infinite alternate;transform-box:fill-box}
.chop{animation:chop .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:85% 90%}
.knock{animation:knock .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
.ear{animation:ear 2.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.ripple{animation:ripple 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.dangle{animation:dangle 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}
.flutter{animation:flutter 1.6s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes bob{to{transform:translateY(-5px)}}
@keyframes breathe{to{transform:scale(1.015,1.03)}}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes wag{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes paw{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
@keyframes twinkle{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes float{from{transform:translateY(4px)}to{transform:translateY(-8px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-50px) scale(1.4);opacity:0}}
@keyframes hop{to{transform:translateY(-14px)}}
@keyframes chop{from{transform:rotate(12deg)}to{transform:rotate(-22deg)}}
@keyframes knock{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes ear{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes dangle{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes flutter{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(14px,-12px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.shiver{animation:shiver .18s linear infinite alternate;transform-box:fill-box}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.fall{animation:fall 3.2s ease-in infinite;transform-box:fill-box}
.blow{animation:blow 1.4s ease-out infinite;transform-box:fill-box}
.snow{animation:snow 6s linear infinite;transform-box:fill-box}
.puff{animation:puff 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes shiver{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translateY(-10px) rotate(0)}100%{transform:translateY(30px) rotate(25deg)}}
@keyframes blow{0%{transform:translateX(-10px);opacity:0}30%{opacity:1}100%{transform:translateX(40px);opacity:0}}
@keyframes snow{0%{transform:translateY(-30px)}100%{transform:translateY(60px)}}
@keyframes puff{from{transform:scale(1)}to{transform:scale(1.06)}}
</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE4FF"/><stop offset="0.7" stop-color="#FFF4D6"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".95"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient><radialGradient id="moonglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6D0" stop-opacity=".55"/><stop offset="1" stop-color="#FFF6D0" stop-opacity="0"/></radialGradient><radialGradient id="ropeglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/></radialGradient></defs>
<rect width="800" height="600" fill="url(#sky)"/><g transform="translate(660 110) scale(1 1)"><circle r="110.39999999999999" fill="url(#glow)"/><g class="glow"><circle r="46" fill="#FFD66B"/><circle r="38.64" fill="#FFE08A"/></g></g><path d="M0 340C90 280 160 250 240 284S360 236 450 250 580 300 660 280 770 270 800 286V600H0Z" fill="#B7D8C6"/><path d="M0 400C120 366 230 356 340 384S530 360 650 370 770 388 800 392V600H0Z" fill="#B5DA8C"/><path d="M0 452C150 428 300 432 420 446S680 440 800 432V600H0Z" fill="#9CC86C"/><g transform="translate(160 150) scale(1 1)"><g class="puff"><path d="M-90 20a40 40 0 0 1 20-70a50 50 0 0 1 90-10a40 40 0 0 1 60 40a30 30 0 0 1-10 40Z" fill="#DCEBF7"/><g transform="translate(0 -6) scale(1 1)"><circle cx="-16" cy="0" r="5" fill="#3A2A22"/><circle cx="16" cy="0" r="5" fill="#3A2A22"/><path d="M-22 -9l10 3M22 -9l-10 3" stroke="#3A2A22" stroke-width="3" stroke-linecap="round"/><path d="M-5 24h10" stroke="#3A2A22" stroke-width="3" stroke-linecap="round"/><circle cx="-24" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="24" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g><circle cx="-34" cy="12" r="16" fill="#C2DCF2"/><circle cx="34" cy="12" r="16" fill="#C2DCF2"/><circle cx="60" cy="18" r="9" fill="#9DBBD8"/></g></g><g transform="translate(260 120) scale(1 1)"><g class="blow" style="animation-delay:0.0s"><path d="M0 0q30-14 60 0t60 0" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/></g></g><g transform="translate(260 154) scale(1 1)"><g class="blow" style="animation-delay:-0.45s"><path d="M0 0q30-14 60 0t60 0" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/></g></g><g transform="translate(260 188) scale(1 1)"><g class="blow" style="animation-delay:-0.9s"><path d="M0 0q30-14 60 0t60 0" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/></g></g><g transform="translate(300 300) scale(1 1)"><g class="blow" style="animation-delay:0.0s"><path d="M0 0q30-14 60 0t60 0" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/></g></g><g transform="translate(300 334) scale(1 1)"><g class="blow" style="animation-delay:-0.45s"><path d="M0 0q30-14 60 0t60 0" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/></g></g><g transform="translate(300 368) scale(1 1)"><g class="blow" style="animation-delay:-0.9s"><path d="M0 0q30-14 60 0t60 0" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/></g></g><g transform="translate(300 200) scale(1 1)"><g class="fall" style="animation-delay:0.0s"><path d="M0 0q10-14 20 0q-10 14-20 0z" fill="#E4573D"/></g></g><g transform="translate(380 160) scale(1 1)"><g class="fall" style="animation-delay:-0.55s"><path d="M0 0q10-14 20 0q-10 14-20 0z" fill="#F2A33C"/></g></g><g transform="translate(460 210) scale(1 1)"><g class="fall" style="animation-delay:-1.1s"><path d="M0 0q10-14 20 0q-10 14-20 0z" fill="#FFC93C"/></g></g><g transform="translate(540 170) scale(1 1)"><g class="fall" style="animation-delay:-1.6500000000000001s"><path d="M0 0q10-14 20 0q-10 14-20 0z" fill="#E4573D"/></g></g><g transform="translate(620 220) scale(1 1)"><g class="fall" style="animation-delay:-2.2s"><path d="M0 0q10-14 20 0q-10 14-20 0z" fill="#F2A33C"/></g></g><g transform="translate(700 180) scale(1 1)"><g class="fall" style="animation-delay:-2.75s"><path d="M0 0q10-14 20 0q-10 14-20 0z" fill="#FFC93C"/></g></g><path d="M0 540C220 520 520 500 800 480V510C520 530 220 560 0 580Z" fill="#EDD39E"/><g transform="translate(680 500) scale(0.9 0.9)"><g class="sway"><path d="M-16 0C-12-60-14-120-6-180H6C14-120 12-60 16 0Z" fill="#8A5A3B"/><path d="M-4-120Q-40-150-62-150" stroke="#8A5A3B" stroke-width="12" stroke-linecap="round" fill="none"/><circle cx="-70" cy="-210" r="62" fill="#5E9B5C"/><circle cx="66" cy="-214" r="64" fill="#5E9B5C"/><circle cx="0" cy="-262" r="80" fill="#6DAD68"/><circle cx="-40" cy="-190" r="52" fill="#6DAD68"/><circle cx="44" cy="-188" r="50" fill="#6DAD68"/><circle cx="-22" cy="-290" r="44" fill="#7DBE73"/><circle cx="34" cy="-262" r="36" fill="#7DBE73" opacity=".9"/></g></g><ellipse cx="460" cy="527" rx="57.0" ry="12" fill="#3A2A1A" opacity="0.14"/><g transform="translate(460 525) scale(0.95 0.95)"><g class="bob"><path d="M-30-2L-26-70h52L30-2" fill="#5F6E8A"/><ellipse cx="-18" cy="-3" rx="15" ry="7" fill="#4E3526"/><ellipse cx="18" cy="-3" rx="15" ry="7" fill="#4E3526"/><path d="M-50-30C-52-110-32-160 0-160S52-110 50-30Z" fill="#9C6B45"/><path d="M0-158V-30" stroke="#7A5232" stroke-width="4"/><circle cx="8" cy="-130" r="4" fill="#E9C46A"/><circle cx="8" cy="-104" r="4" fill="#E9C46A"/><circle cx="8" cy="-78" r="4" fill="#E9C46A"/><circle cx="8" cy="-52" r="4" fill="#E9C46A"/><path d="M-36-140Q-10-120 10-120M36-140Q10-110-10-110" stroke="#9C6B45" stroke-width="20" fill="none" stroke-linecap="round"/><circle cy="-192" r="30" fill="#FFD6B3"/><ellipse cy="-214" rx="46" ry="10" fill="#C9A37A"/><path d="M-26-214q0-30 26-30t26 30z" fill="#B48A55"/><g transform="translate(0 -190) scale(1 1)"><circle cx="-11" cy="0" r="4.5" fill="#3A2A22"/><circle cx="11" cy="0" r="4.5" fill="#3A2A22"/><ellipse cy="14" rx="4.5" ry="5.5" fill="#B5485A"/><circle cx="-19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/><circle cx="19" cy="10" r="5.5" fill="#FF9AA8" opacity=".55"/></g></g></g>
</svg>
